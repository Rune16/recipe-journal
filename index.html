  <style>
/* ===== base.css ===== */
/* ==========================================================================
   食谱集 · base.css
   设计令牌 / Reset / 全局排版 / 工具类
   ========================================================================== */

:root {
  /* ---- 主色（淡紫 / 天蓝 / 淡紫罗兰）---- */
  --c-lavender: #dbc4fd;
  --c-sky: #99caf0;
  --c-periwinkle: #b6bcec;

  /* ---- 背景（暖奶油 / 暖粉 / 淡紫）---- */
  --c-bg: #fffbf5;
  --c-bg-blush: #fff0f0;
  --c-bg-lilac: #f7e7f9;

  /* ---- 高光与纯白 ---- */
  --c-pink: #fbbcf3;
  --c-pink-soft: #fcd6ff;
  --c-white: #ffffff;

  /* ---- 功能色 ---- */
  --c-mint: #dbf5e0;
  --c-rose: #eec8c8;
  --c-violet-soft: #c6c0e8;
  --c-blue-soft: #cce1f5;

  /* ---- 派生文字色：在浅色底上保证对比度（AA 级）---- */
  --c-ink: #33284a;
  --c-ink-2: #6f6684;
  --c-ink-3: #a49daf;
  --c-ink-on-dark: #fffdf9;

  /* ---- 徽章功能色 ---- */
  --c-easy-bg: var(--c-mint);
  --c-easy-fg: #2f6b45;
  --c-mid-bg: var(--c-blue-soft);
  --c-mid-fg: #2b5a7d;
  --c-hard-bg: var(--c-rose);
  --c-hard-fg: #8a3b3b;
  --c-danger: #c2565c;
  --c-danger-soft: #fbe6e8;

  /* ---- 线条与表面 ---- */
  --c-line: #f0e7f1;
  --c-line-strong: #e2d5e6;
  --c-surface: rgba(255, 255, 255, 0.78);
  --c-surface-solid: #ffffff;

  /* ---- 渐变 ---- */
  --g-primary: linear-gradient(135deg, #dbc4fd 0%, #b6bcec 48%, #99caf0 100%);
  --g-warm: linear-gradient(135deg, #fffbf5 0%, #f7e7f9 55%, #eef4fd 100%);
  --g-blush: linear-gradient(135deg, #ffe9f3 0%, #fff0f0 55%, #f3ebff 100%);

  /* ---- 圆角 ---- */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 30px;
  --r-full: 999px;

  /* ---- 阴影 ---- */
  --sh-1: 0 2px 10px -5px rgba(94, 78, 150, 0.20);
  --sh-2: 0 14px 30px -16px rgba(94, 78, 150, 0.32);
  --sh-3: 0 26px 56px -22px rgba(94, 78, 150, 0.40);
  --sh-glow: 0 16px 38px -18px rgba(182, 188, 236, 0.90);

  /* ---- 间距 ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 22px;
  --sp-6: 30px;
  --sp-7: 42px;
  --sp-8: 60px;

  /* ---- 字体 ---- */
  --font-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Georgia, serif;

  /* ---- 动效 ---- */
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --t-fast: 150ms;
  --t-base: 260ms;
  --t-slow: 420ms;

  /* ---- 布局 ---- */
  --page-max: 1200px;
  --nav-h: 68px;
}

/* --------------------------------------------------------------------------
   Reset
   -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.7;
  color: var(--c-ink);
  background-color: var(--c-bg);
  /* 柔和的暖色调光晕，营造杂志质感 */
  background-image:
    radial-gradient(900px 460px at 8% -6%, rgba(219, 196, 253, 0.42), transparent 62%),
    radial-gradient(760px 420px at 96% 2%, rgba(153, 202, 240, 0.34), transparent 60%),
    radial-gradient(680px 420px at 50% 108%, rgba(251, 188, 243, 0.26), transparent 62%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--c-ink);
}

p {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

table {
  border-collapse: collapse;
}

:focus-visible {
  outline: 2px solid var(--c-periwinkle);
  outline-offset: 2px;
  border-radius: 4px;
}

::selection {
  background: var(--c-lavender);
  color: var(--c-ink);
}

/* --------------------------------------------------------------------------
   滚动条（桌面端）
   -------------------------------------------------------------------------- */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(182, 188, 236, 0.55);
  border: 3px solid transparent;
  border-radius: var(--r-full);
  background-clip: content-box;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(160, 156, 224, 0.85);
  background-clip: content-box;
}

/* --------------------------------------------------------------------------
   工具类
   -------------------------------------------------------------------------- */
.container {
  width: 100%;
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 0 var(--sp-5);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.hidden {
  display: none !important;
}

.text-soft {
  color: var(--c-ink-2);
}

.text-faint {
  color: var(--c-ink-3);
}

.text-center {
  text-align: center;
}

/* 渐变文字标题 */
.grad-text {
  background: linear-gradient(120deg, #8d7fd8 0%, #6b81d6 42%, #6fa8d8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* 卡片式面板 */
.panel {
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

/* 分区标题 */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);
  flex-wrap: wrap;
}

.section-title {
  font-size: 20px;
  font-weight: 600;
}

.section-sub {
  font-size: 13px;
  color: var(--c-ink-2);
}

/* --------------------------------------------------------------------------
   入场动画
   -------------------------------------------------------------------------- */
@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.94);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes shimmer {
  0% {
    background-position: -220% 0;
  }
  100% {
    background-position: 220% 0;
  }
}

.rise-in {
  animation: riseIn var(--t-slow) var(--ease) both;
}

.fade-in {
  animation: fadeIn var(--t-base) var(--ease) both;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}


/* ===== components.css ===== */
/* ==========================================================================
   食谱集 · components.css
   按钮 / 卡片 / 胶囊标签 / 徽章 / 表单 / 上传区 / 步骤时间轴 / Toast / 弹窗 / 灯箱
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. 按钮
   -------------------------------------------------------------------------- */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: 44px;
  padding: 0 20px;
  border-radius: var(--r-full);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
  border: 1px solid transparent;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-base) var(--ease),
    background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
    border-color var(--t-fast) var(--ease);
}

.btn:active {
  transform: translateY(1px) scale(0.985);
}

.btn__icon {
  display: inline-flex;
  width: 18px;
  height: 18px;
  flex: none;
}

.btn__icon svg {
  width: 100%;
  height: 100%;
}

/* 主按钮：粉紫渐变 + 深色文字，兼顾美感与对比度 */
.btn--primary {
  background: var(--g-primary);
  color: var(--c-ink);
  box-shadow: var(--sh-glow);
}

.btn--primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 22px 44px -18px rgba(153, 202, 240, 1);
}

/* 次按钮 */
.btn--ghost {
  background: rgba(255, 255, 255, 0.72);
  border-color: var(--c-line-strong);
  color: var(--c-ink);
}

.btn--ghost:hover {
  background: var(--c-white);
  border-color: var(--c-periwinkle);
  transform: translateY(-2px);
  box-shadow: var(--sh-2);
}

/* 文字按钮 */
.btn--text {
  min-height: 36px;
  padding: 0 12px;
  background: transparent;
  color: var(--c-ink-2);
}

.btn--text:hover {
  color: var(--c-ink);
  background: rgba(219, 196, 253, 0.22);
}

/* 危险按钮 */
.btn--danger {
  background: var(--c-danger-soft);
  border-color: rgba(194, 86, 92, 0.28);
  color: var(--c-danger);
}

.btn--danger:hover {
  background: var(--c-danger);
  border-color: var(--c-danger);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 16px 30px -16px rgba(194, 86, 92, 0.9);
}

.btn--sm {
  min-height: 36px;
  padding: 0 14px;
  font-size: 13px;
}

.btn--block {
  width: 100%;
}

.btn[disabled] {
  opacity: 0.55;
  pointer-events: none;
}

/* 圆形图标按钮 */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-full);
  color: var(--c-ink-2);
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--c-line);
  transition: all var(--t-fast) var(--ease);
}

.icon-btn:hover {
  color: var(--c-ink);
  background: var(--c-white);
  border-color: var(--c-periwinkle);
  transform: translateY(-2px);
  box-shadow: var(--sh-1);
}

.icon-btn svg {
  width: 18px;
  height: 18px;
}

/* --------------------------------------------------------------------------
   2. 胶囊标签 / 徽章
   -------------------------------------------------------------------------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 18px;
  border-radius: var(--r-full);
  font-size: 14px;
  font-weight: 500;
  color: var(--c-ink-2);
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid var(--c-line-strong);
  transition: all var(--t-fast) var(--ease);
  user-select: none;
}

.chip:hover {
  color: var(--c-ink);
  border-color: var(--c-periwinkle);
  transform: translateY(-2px);
  box-shadow: var(--sh-1);
}

.chip.is-active {
  background: var(--g-primary);
  border-color: transparent;
  color: var(--c-ink);
  font-weight: 700;
  box-shadow: var(--sh-glow);
}

.chip__count {
  font-size: 12px;
  opacity: 0.62;
  font-variant-numeric: tabular-nums;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 11px;
  border-radius: var(--r-full);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.7;
  white-space: nowrap;
}

.badge--easy {
  background: var(--c-easy-bg);
  color: var(--c-easy-fg);
}

.badge--medium {
  background: var(--c-mid-bg);
  color: var(--c-mid-fg);
}

.badge--hard {
  background: var(--c-hard-bg);
  color: var(--c-hard-fg);
}

.badge--category {
  background: rgba(219, 196, 253, 0.5);
  color: var(--c-ink);
}

.badge--custom {
  background: var(--c-pink-soft);
  color: #8b4a86;
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--r-full);
  font-size: 12px;
  color: var(--c-ink-2);
  background: rgba(204, 225, 245, 0.5);
  border: 1px solid rgba(153, 202, 240, 0.4);
}

/* --------------------------------------------------------------------------
   3. 图片与占位图
   -------------------------------------------------------------------------- */
.media {
  position: relative;
  overflow: hidden;
  background: var(--c-bg-lilac);
}

/* 图片叠在占位层之上，加载成功后淡入；失败时该节点会被移除，露出占位层 */
.media > img {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: transform var(--t-slow) var(--ease), opacity var(--t-base) var(--ease);
}

.media.is-loaded > img {
  opacity: 1;
}

.media--4x3 {
  aspect-ratio: 4 / 3;
}

.media--16x9 {
  aspect-ratio: 16 / 9;
}

.media--square {
  aspect-ratio: 1 / 1;
}

/* 无图 / 加载失败时的内联占位图（离线可用，不产生破图）*/
.media-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--g-blush);
  color: var(--c-ink);
}

.media-fallback::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 22% 24%, rgba(255, 255, 255, 0.85), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(153, 202, 240, 0.55), transparent 46%);
  pointer-events: none;
}

.media-fallback__emoji {
  font-size: 46px;
  line-height: 1;
  filter: drop-shadow(0 6px 12px rgba(94, 78, 150, 0.22));
}

.media-fallback__text {
  position: relative;
  z-index: 1;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--c-ink);
  opacity: 0.72;
}

.media-fallback--sm .media-fallback__emoji {
  font-size: 30px;
}

.media-fallback--sm .media-fallback__text {
  font-size: 11px;
}

.media-fallback--lg .media-fallback__emoji {
  font-size: 88px;
}

.media-fallback--lg .media-fallback__text {
  font-size: 15px;
  letter-spacing: 0.16em;
}

/* 图片缩略图（步骤图）*/
.thumb {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-md);
  border: 1px solid var(--c-line);
  background: var(--c-bg-lilac);
  cursor: zoom-in;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform var(--t-base) var(--ease);
}

.thumb:hover img {
  transform: scale(1.04);
}

/* --------------------------------------------------------------------------
   4. 菜谱卡片
   -------------------------------------------------------------------------- */
.recipe-card {
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: var(--r-xl);
  background: var(--c-surface-solid);
  border: 1px solid var(--c-line);
  box-shadow: var(--sh-2);
  transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease),
    border-color var(--t-base) var(--ease);
}

.recipe-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--sh-3);
  border-color: rgba(182, 188, 236, 0.7);
}

.recipe-card__link {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.recipe-card__media {
  aspect-ratio: 4 / 3;
}

.recipe-card:hover .recipe-card__media > img {
  transform: scale(1.06);
}

.recipe-card__time {
  position: absolute;
  z-index: 2;
  right: 12px;
  bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 11px;
  border-radius: var(--r-full);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-ink);
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: var(--sh-1);
}

.recipe-card__time svg {
  width: 13px;
  height: 13px;
}

.recipe-card__body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 18px 18px 20px;
  flex: 1;
}

.recipe-card__title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.recipe-card__desc {
  font-size: 13px;
  color: var(--c-ink-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 44px;
}

.recipe-card__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: auto;
}

.recipe-card__steps-hint {
  margin-left: auto;
  font-size: 12px;
  color: var(--c-ink-3);
  font-variant-numeric: tabular-nums;
}

/* --------------------------------------------------------------------------
   5. 表单控件
   -------------------------------------------------------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.field__label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-ink-2);
}

.field__req {
  color: var(--c-danger);
  font-size: 13px;
}

.field__hint {
  font-size: 12px;
  color: var(--c-ink-3);
}

.field__error {
  display: none;
  font-size: 12px;
  font-weight: 600;
  color: var(--c-danger);
}

.field.has-error .field__error {
  display: block;
}

.input,
.textarea,
.select {
  width: 100%;
  min-height: 46px;
  padding: 11px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--c-line-strong);
  background: rgba(255, 255, 255, 0.86);
  font-size: 14px;
  color: var(--c-ink);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease),
    background-color var(--t-fast) var(--ease);
}

.input::placeholder,
.textarea::placeholder {
  color: var(--c-ink-3);
}

.input:hover,
.textarea:hover,
.select:hover {
  border-color: var(--c-periwinkle);
  background: var(--c-white);
}

.input:focus,
.textarea:focus,
.select:focus {
  outline: none;
  background: var(--c-white);
  border-color: var(--c-periwinkle);
  box-shadow: 0 0 0 4px rgba(219, 196, 253, 0.45);
}

.textarea {
  min-height: 96px;
  resize: vertical;
  line-height: 1.7;
}

.select {
  appearance: none;
  padding-right: 38px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236f6684' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 16px;
  cursor: pointer;
}

.field.has-error .input,
.field.has-error .textarea,
.field.has-error .select {
  border-color: var(--c-danger);
  background: var(--c-danger-soft);
}

/* 搜索输入框 */
.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-box svg {
  position: absolute;
  left: 18px;
  width: 20px;
  height: 20px;
  color: var(--c-ink-3);
  pointer-events: none;
}

.search-box .input {
  min-height: 58px;
  padding-left: 52px;
  padding-right: 52px;
  border-radius: var(--r-full);
  font-size: 15px;
  border-color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: var(--sh-2);
}

.search-box .input:focus {
  box-shadow: var(--sh-3), 0 0 0 4px rgba(219, 196, 253, 0.5);
}

.search-box__clear {
  position: absolute;
  right: 10px;
  display: none;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: var(--r-full);
  color: var(--c-ink-2);
  transition: all var(--t-fast) var(--ease);
}

.search-box__clear:hover {
  background: rgba(219, 196, 253, 0.35);
  color: var(--c-ink);
}

.search-box__clear svg {
  position: static;
  width: 16px;
  height: 16px;
  pointer-events: auto;
}

.search-box.is-filled .search-box__clear {
  display: inline-flex;
}

.search-box--sm .input {
  min-height: 42px;
  padding-left: 40px;
  font-size: 13px;
}

.search-box--sm svg {
  left: 14px;
  width: 16px;
  height: 16px;
}

/* --------------------------------------------------------------------------
   6. 图片上传区
   -------------------------------------------------------------------------- */
.uploader {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 150px;
  padding: 20px;
  border-radius: var(--r-lg);
  border: 2px dashed var(--c-line-strong);
  background: rgba(255, 255, 255, 0.6);
  color: var(--c-ink-2);
  text-align: center;
  transition: all var(--t-base) var(--ease);
  cursor: pointer;
  overflow: hidden;
}

.uploader:hover,
.uploader.is-dragover {
  border-color: var(--c-periwinkle);
  background: rgba(219, 196, 253, 0.2);
  color: var(--c-ink);
  transform: translateY(-2px);
}

.uploader svg {
  width: 26px;
  height: 26px;
  color: var(--c-ink-3);
}

.uploader__placeholder {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: opacity var(--t-base) var(--ease);
}

.uploader.is-loading .uploader__placeholder {
  opacity: 0.45;
}

.uploader__title {
  font-size: 14px;
  font-weight: 600;
}

.uploader__hint {
  font-size: 12px;
  color: var(--c-ink-3);
}

.uploader__preview {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.uploader__remove {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
  display: none;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: var(--r-full);
  color: #fff;
  background: rgba(51, 40, 74, 0.66);
  backdrop-filter: blur(6px);
  transition: all var(--t-fast) var(--ease);
}

.uploader__remove:hover {
  background: var(--c-danger);
  transform: scale(1.06);
}

.uploader__remove svg {
  width: 14px;
  height: 14px;
  color: #fff;
}

.uploader.has-image {
  border-style: solid;
  border-color: transparent;
  padding: 0;
}

.uploader.has-image .uploader__placeholder {
  display: none;
}

.uploader.has-image .uploader__remove {
  display: inline-flex;
}

.uploader.is-loading::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    100deg,
    rgba(255, 255, 255, 0) 20%,
    rgba(255, 255, 255, 0.85) 50%,
    rgba(255, 255, 255, 0) 80%
  );
  background-size: 220% 100%;
  animation: shimmer 1.1s linear infinite;
  pointer-events: none;
}

/* 步骤图小上传区 */
.uploader--mini {
  min-height: 104px;
  padding: 12px;
  border-radius: var(--r-md);
}

.uploader--mini svg {
  width: 20px;
  height: 20px;
}

.uploader--mini .uploader__title {
  font-size: 13px;
}

.uploader--mini .uploader__hint {
  display: none;
}

/* 图标封面选择器 */
.emoji-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.emoji-option {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: var(--r-md);
  font-size: 22px;
  line-height: 1;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid var(--c-line-strong);
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-base) var(--ease),
    border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease);
}

.emoji-option:hover {
  transform: translateY(-2px);
  border-color: var(--c-periwinkle);
  box-shadow: var(--sh-1);
}

.emoji-option.is-active {
  background: var(--g-primary);
  border-color: transparent;
  box-shadow: var(--sh-glow);
  transform: translateY(-2px);
}

/* --------------------------------------------------------------------------
   7. 动态行（用料 / 步骤）
   -------------------------------------------------------------------------- */
.dynamic-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ingredient-row {
  display: grid;
  grid-template-columns: 1fr 130px 42px;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid var(--c-line);
  transition: all var(--t-fast) var(--ease);
}

.ingredient-row:hover {
  border-color: var(--c-line-strong);
  background: var(--c-white);
}

.ingredient-row .input {
  min-height: 40px;
  background: transparent;
  border-color: transparent;
}

.ingredient-row .input:hover,
.ingredient-row .input:focus {
  background: rgba(255, 255, 255, 0.9);
  border-color: var(--c-line-strong);
}

.ingredient-row__index {
  display: none;
}

/* 删除行按钮 */
.row-remove {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: var(--r-md);
  color: var(--c-ink-3);
  transition: all var(--t-fast) var(--ease);
}

.row-remove:hover {
  color: var(--c-danger);
  background: var(--c-danger-soft);
}

.row-remove svg {
  width: 16px;
  height: 16px;
}

.step-row {
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 14px;
  padding: 16px;
  border-radius: var(--r-lg);
  background: rgba(255, 255, 255, 0.74);
  border: 1px solid var(--c-line);
  transition: all var(--t-fast) var(--ease);
}

.step-row:hover {
  border-color: var(--c-line-strong);
  background: var(--c-white);
  box-shadow: var(--sh-1);
}

.step-row__index {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: var(--r-full);
  font-size: 14px;
  font-weight: 700;
  color: var(--c-ink);
  background: var(--g-primary);
  box-shadow: var(--sh-1);
}

.step-row__body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.step-row__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
}

.step-row__label {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-ink-2);
}

.step-row__tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-row .uploader--mini {
  max-width: 260px;
}

/* --------------------------------------------------------------------------
   8. 步骤时间轴（详情页）
   -------------------------------------------------------------------------- */
.steps-timeline {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}

.step-card {
  position: relative;
  display: grid;
  grid-template-columns: 46px 1fr;
  gap: var(--sp-4);
}

.step-card__rail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.step-card__dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-full);
  font-size: 15px;
  font-weight: 700;
  color: var(--c-ink);
  background: var(--g-primary);
  box-shadow: var(--sh-glow);
  flex: none;
}

.step-card:not(:last-child) .step-card__rail::after {
  content: "";
  flex: 1;
  width: 2px;
  margin-top: 8px;
  border-radius: var(--r-full);
  background: linear-gradient(180deg, rgba(219, 196, 253, 0.9), rgba(153, 202, 240, 0.15));
}

.step-card__body {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px 20px 20px;
  border-radius: var(--r-lg);
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid var(--c-line);
  box-shadow: var(--sh-1);
  transition: box-shadow var(--t-base) var(--ease), transform var(--t-base) var(--ease);
  min-width: 0;
}

.step-card__body:hover {
  box-shadow: var(--sh-2);
  transform: translateY(-2px);
}

.step-card__text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--c-ink);
  white-space: pre-wrap;
  word-break: break-word;
}

.step-card__media {
  width: min(100%, 420px);
  aspect-ratio: 4 / 3;
}

/* --------------------------------------------------------------------------
   9. 用料清单
   -------------------------------------------------------------------------- */
.ingredient-table {
  width: 100%;
  font-size: 14px;
}

.ingredient-table tr:nth-child(odd) {
  background: rgba(219, 196, 253, 0.14);
}

.ingredient-table td {
  padding: 12px 16px;
}

.ingredient-table td:first-child {
  border-top-left-radius: var(--r-sm);
  border-bottom-left-radius: var(--r-sm);
  color: var(--c-ink);
  font-weight: 500;
}

.ingredient-table td:last-child {
  border-top-right-radius: var(--r-sm);
  border-bottom-right-radius: var(--r-sm);
  text-align: right;
  color: var(--c-ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* --------------------------------------------------------------------------
   10. 元信息条
   -------------------------------------------------------------------------- */
.meta-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: rgba(240, 231, 241, 0.7);
  border: 1px solid var(--c-line);
}

.meta-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 16px 10px;
  background: rgba(255, 255, 255, 0.8);
}

.meta-item__label {
  font-size: 12px;
  color: var(--c-ink-3);
  letter-spacing: 0.04em;
}

.meta-item__value {
  font-size: 16px;
  font-weight: 700;
  color: var(--c-ink);
}

/* --------------------------------------------------------------------------
   11. Toast
   -------------------------------------------------------------------------- */
.toast-host {
  position: fixed;
  left: 50%;
  bottom: 30px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  transform: translateX(-50%);
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(92vw, 460px);
  padding: 12px 20px;
  border-radius: var(--r-full);
  font-size: 14px;
  font-weight: 500;
  color: var(--c-ink-on-dark);
  background: rgba(51, 40, 74, 0.93);
  box-shadow: var(--sh-3);
  backdrop-filter: blur(10px);
  animation: riseIn 240ms var(--ease) both;
}

.toast--success {
  background: rgba(47, 107, 69, 0.94);
}

.toast--error {
  background: rgba(163, 62, 68, 0.94);
}

.toast.is-leaving {
  animation: fadeIn 200ms var(--ease) reverse both;
}

/* --------------------------------------------------------------------------
   12. 遮罩弹窗 / 确认框
   -------------------------------------------------------------------------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: var(--sp-5);
  background: rgba(51, 40, 74, 0.46);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.overlay.is-open {
  display: flex;
  animation: fadeIn 180ms var(--ease) both;
}

.dialog {
  width: min(100%, 420px);
  padding: 26px;
  border-radius: var(--r-xl);
  background: var(--c-bg);
  box-shadow: var(--sh-3);
  animation: popIn 240ms var(--ease) both;
  text-align: center;
}

.dialog__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  margin-bottom: 14px;
  border-radius: var(--r-full);
  background: var(--c-danger-soft);
  color: var(--c-danger);
}

.dialog__icon svg {
  width: 26px;
  height: 26px;
}

.dialog__title {
  font-size: 19px;
  margin-bottom: 8px;
}

.dialog__text {
  font-size: 14px;
  color: var(--c-ink-2);
  margin-bottom: 22px;
}

.dialog__actions {
  display: flex;
  gap: 10px;
}

.dialog__actions .btn {
  flex: 1;
}

/* --------------------------------------------------------------------------
   13. 灯箱
   -------------------------------------------------------------------------- */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
  padding: var(--sp-5);
  background: rgba(38, 29, 56, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: zoom-out;
}

.lightbox.is-open {
  display: flex;
  animation: fadeIn 200ms var(--ease) both;
}

.lightbox img {
  max-width: min(94vw, 1000px);
  max-height: 86vh;
  border-radius: var(--r-lg);
  box-shadow: var(--sh-3);
  animation: popIn 260ms var(--ease) both;
}

.lightbox__close {
  position: absolute;
  top: 22px;
  right: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: var(--r-full);
  color: #fff;
  background: rgba(255, 255, 255, 0.16);
  transition: all var(--t-fast) var(--ease);
}

.lightbox__close:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: rotate(90deg);
}

.lightbox__close svg {
  width: 20px;
  height: 20px;
}

/* --------------------------------------------------------------------------
   14. 空状态
   -------------------------------------------------------------------------- */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 70px 24px 80px;
  text-align: center;
}

.empty-state__art {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 108px;
  height: 108px;
  border-radius: var(--r-full);
  font-size: 46px;
  background: var(--g-blush);
  box-shadow: var(--sh-2);
}

.empty-state__title {
  font-size: 20px;
}

.empty-state__text {
  font-size: 14px;
  color: var(--c-ink-2);
  max-width: 40ch;
}

/* --------------------------------------------------------------------------
   15. 骨架屏
   -------------------------------------------------------------------------- */
.skeleton {
  border-radius: var(--r-md);
  background: linear-gradient(
    100deg,
    rgba(240, 231, 241, 0.75) 20%,
    rgba(255, 255, 255, 0.95) 50%,
    rgba(240, 231, 241, 0.75) 80%
  );
  background-size: 220% 100%;
  animation: shimmer 1.3s linear infinite;
}

/* --------------------------------------------------------------------------
   16. 轮播图（首页精选菜谱）
   结构：#carousel > .carousel__progress + .carousel__viewport > .carousel__track
         + .carousel__nav ×2 + .carousel__toggle + .carousel__dots
   -------------------------------------------------------------------------- */
@keyframes carouselProgress {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}

.carousel {
  position: relative;
  isolation: isolate;
}

/* 自动播放进度条：贴在图卡顶部内侧，暂停/减弱动效时隐藏 */
.carousel__progress {
  position: absolute;
  top: 18px;
  left: 26px;
  right: 26px;
  z-index: 6;
  height: 3px;
  border-radius: var(--r-full);
  overflow: hidden;
  background: rgba(255, 255, 255, 0.3);
  box-shadow: inset 0 0 0 1px rgba(51, 40, 74, 0.06);
  opacity: 0;
  transition: opacity var(--t-base) var(--ease);
  pointer-events: none;
}

.carousel.is-playing .carousel__progress {
  opacity: 1;
}

.carousel__progress-bar {
  display: block;
  width: 100%;
  height: 100%;
  transform: scaleX(0);
  transform-origin: left center;
  border-radius: var(--r-full);
  background: var(--g-primary);
}

.carousel.is-playing .carousel__progress-bar {
  animation: carouselProgress var(--carousel-duration, 5200ms) linear;
}

.carousel.is-playing.is-paused .carousel__progress-bar {
  animation-play-state: paused;
}

.carousel__viewport {
  overflow: hidden;
  border-radius: var(--r-xl);
  box-shadow: var(--sh-3);
}

.carousel__track {
  display: flex;
  will-change: transform;
  transition: transform var(--t-slow) var(--ease);
}

.carousel__slide {
  flex: 0 0 100%;
  min-width: 0;
}

.carousel__link {
  display: block;
}

.carousel__media {
  aspect-ratio: 21 / 9;
  width: 100%;
}

/* 底部深色渐变遮罩，承载文字与按钮 */
.carousel__media::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  background: linear-gradient(
    to top,
    rgba(38, 29, 56, 0.86) 0%,
    rgba(38, 29, 56, 0.44) 46%,
    rgba(38, 29, 56, 0.04) 82%
  );
  pointer-events: none;
}

.carousel__overlay {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-end;
  gap: 9px;
  padding: 40px 46px 64px;
  color: var(--c-ink-on-dark);
}

.carousel__badge {
  background: rgba(255, 255, 255, 0.92);
  color: var(--c-ink);
}

.carousel__title {
  font-size: clamp(22px, 3.2vw, 38px);
  color: #fff;
  text-shadow: 0 2px 18px rgba(38, 29, 56, 0.35);
}

.carousel__desc {
  max-width: 58ch;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.88);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.carousel__meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 2px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.9);
}

.carousel__meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.carousel__meta-item svg {
  width: 15px;
  height: 15px;
}

.carousel__cta {
  margin-top: 8px;
}

.carousel__cta svg {
  width: 16px;
  height: 16px;
}

/* 左右切换箭头 */
.carousel__nav {
  position: absolute;
  top: 50%;
  z-index: 5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  margin-top: -23px;
  border-radius: var(--r-full);
  color: var(--c-ink);
  background: rgba(255, 255, 255, 0.76);
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: var(--sh-2);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: transform var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease),
    box-shadow var(--t-base) var(--ease);
}

.carousel__nav:hover {
  background: var(--c-white);
  transform: scale(1.08);
  box-shadow: var(--sh-3);
}

.carousel__nav svg {
  width: 20px;
  height: 20px;
}

.carousel__nav--prev {
  left: 20px;
}

.carousel__nav--next {
  right: 20px;
}

/* 播放 / 暂停 */
.carousel__toggle {
  position: absolute;
  right: 22px;
  bottom: 20px;
  z-index: 5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: var(--r-full);
  color: var(--c-ink);
  background: rgba(255, 255, 255, 0.76);
  border: 1px solid rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: transform var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease);
}

.carousel__toggle:hover {
  background: var(--c-white);
  transform: scale(1.08);
}

.carousel__toggle svg {
  width: 16px;
  height: 16px;
}

/* 指示点 */
.carousel__dots {
  position: absolute;
  left: 50%;
  bottom: 25px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 9px;
  transform: translateX(-50%);
}

.carousel__dot {
  width: 9px;
  height: 9px;
  padding: 0;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.55);
  box-shadow: 0 0 0 1px rgba(51, 40, 74, 0.08);
  transition: width var(--t-base) var(--ease), background-color var(--t-base) var(--ease);
}

.carousel__dot:hover {
  background: rgba(255, 255, 255, 0.88);
}

.carousel__dot.is-active {
  width: 26px;
  background: var(--c-white);
}

/* 只有一张时不出控件 */
.carousel.is-single .carousel__progress,
.carousel.is-single .carousel__nav,
.carousel.is-single .carousel__toggle,
.carousel.is-single .carousel__dots {
  display: none;
}

@media (prefers-reduced-motion: reduce) {
  .carousel.is-playing .carousel__progress {
    opacity: 0;
  }

  .carousel.is-playing .carousel__progress-bar {
    animation: none;
  }
}

/* --------------------------------------------------------------------------
   17. 菜谱分类卡片
   -------------------------------------------------------------------------- */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--sp-4);
}

.category-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  overflow: hidden;
  padding: 18px 20px;
  text-align: left;
  border-radius: var(--r-lg);
  background: var(--c-surface-solid);
  border: 1px solid var(--c-line);
  box-shadow: var(--sh-1);
  transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease),
    border-color var(--t-base) var(--ease), background-color var(--t-base) var(--ease);
}

.category-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--sh-2);
  border-color: rgba(182, 188, 236, 0.75);
}

.category-card.is-active {
  background: var(--g-primary);
  border-color: transparent;
  box-shadow: var(--sh-glow);
}

.category-card__icon {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  flex: none;
  border-radius: var(--r-md);
  color: var(--c-ink);
  background: linear-gradient(135deg, rgba(219, 196, 253, 0.6), rgba(153, 202, 240, 0.55));
  transition: background var(--t-base) var(--ease), transform var(--t-base) var(--ease);
}

.category-card:hover .category-card__icon {
  transform: scale(1.06);
}

.category-card.is-active .category-card__icon {
  background: rgba(255, 255, 255, 0.72);
}

.category-card__icon svg {
  width: 24px;
  height: 24px;
}

.category-card__body {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.category-card__name {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.category-card__count {
  font-size: 12px;
  color: var(--c-ink-3);
  font-variant-numeric: tabular-nums;
}

.category-card.is-active .category-card__count {
  color: rgba(51, 40, 74, 0.68);
}

/* 右上方极低透明度的菜品水印 */
.category-card__watermark {
  position: absolute;
  top: -14px;
  right: 6px;
  font-size: 58px;
  line-height: 1;
  opacity: 0.14;
  pointer-events: none;
  user-select: none;
}

.category-card.is-active .category-card__watermark {
  opacity: 0.2;
}

/* ==========================================================================

/* --------------------------------------------------------------------------

.site-nav.is-scrolled {

}

.site-nav__inner {

  background: var(--g-primary);
  box-shadow: var(--sh-glow);
}

.brand__text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.brand__name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.brand__sub {
  font-size: 11px;
  color: var(--c-ink-3);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.site-nav__search {
  flex: 1;
  max-width: 380px;
  margin: 0 auto;
}

.site-nav__actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: none;
  margin-left: auto;
}

/* 详情页导航 */
.detail-nav__title {
  font-size: 15px;
  font-weight: 600;
  color: var(--c-ink-2);
  max-width: 40vw;
  overflow: hidden;

  white-space: nowrap;
}

.detail-nav__left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

/* --------------------------------------------------------------------------
   首页区块（轮播图 / 菜谱分类 / 热门菜谱）
   -------------------------------------------------------------------------- */
.home-section {
  padding-bottom: var(--sp-7);
}

.home-section--carousel {
  padding-top: var(--sp-5);
}

.home-section--recipes {
  padding-bottom: var(--sp-8);
}

.home-section__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.home-section__head-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}

.home-section__dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: var(--r-full);
  background: var(--g-primary);
  box-shadow: var(--sh-glow);
}

.home-section__title {
  font-size: 22px;
}

.home-section__badge {
  padding: 3px 12px;
  border-radius: var(--r-full);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-ink-2);
  background: rgba(219, 196, 253, 0.32);
  border: 1px solid var(--c-line);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.home-section__sub {
  margin-bottom: var(--sp-4);
  font-size: 13px;
  color: var(--c-ink-2);
}

.home-section__reset {
  flex: none;
}

/* --------------------------------------------------------------------------
   菜谱网格
   -------------------------------------------------------------------------- */
.recipe-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--sp-5);
}

.recipe-grid > * {
  animation: riseIn var(--t-slow) var(--ease) both;
}

/* --------------------------------------------------------------------------
   页脚
   -------------------------------------------------------------------------- */
.site-footer {
  margin-top: var(--sp-6);
  padding: var(--sp-7) 0 var(--sp-6);
  border-top: 1px solid var(--c-line);
  background: rgba(255, 255, 255, 0.5);
}

.site-footer__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
}

.site-footer__text {
  font-size: 13px;
  color: var(--c-ink-2);
}

.site-footer__actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* --------------------------------------------------------------------------
   详情页
   -------------------------------------------------------------------------- */
.detail-hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-xl);
  box-shadow: var(--sh-3);
  background: var(--c-bg-lilac);
  isolation: isolate;
}

.detail-hero__media {
  aspect-ratio: 16 / 7;
  cursor: zoom-in;
}

.detail-hero__media::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  background: linear-gradient(
    to top,
    rgba(38, 29, 56, 0.82) 0%,
    rgba(38, 29, 56, 0.34) 42%,
    rgba(38, 29, 56, 0.02) 78%
  );
}

.detail-hero__content {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 3;
  padding: 30px 34px;
  color: var(--c-ink-on-dark);
}

.detail-hero__meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.detail-hero__meta .badge {
  background: rgba(255, 255, 255, 0.9);
  color: var(--c-ink);
}

.detail-hero__title {
  font-size: clamp(26px, 4vw, 40px);
  color: #fff;
  margin-bottom: 8px;
}

.detail-hero__desc {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.86);
  max-width: 62ch;
}

.detail-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: var(--sp-6);
  align-items: start;
  padding: var(--sp-6) 0 var(--sp-8);
}

.detail-main {
  display: flex;
  flex-direction: column;
  gap: var(--sp-6);
  min-width: 0;
}

.detail-side {
  position: sticky;
  top: calc(var(--nav-h) + 20px);
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}

.detail-block {
  padding: 24px 26px 26px;
  border-radius: var(--r-xl);
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  box-shadow: var(--sh-2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.detail-block__title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  margin-bottom: 18px;
}

.detail-block__title .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: var(--r-full);
  background: var(--g-primary);
  flex: none;
}

.detail-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.detail-actions .btn {
  width: 100%;
}

.detail-note {
  margin-top: 14px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--c-ink-3);
  text-align: center;
}

.detail-note:empty {
  display: none;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* --------------------------------------------------------------------------
   表单页
   -------------------------------------------------------------------------- */
.form-page {
  padding: var(--sp-6) 0 var(--sp-8);
}

.form-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: var(--sp-6);
  align-items: start;
}

.form-main {
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}

.form-side {
  position: sticky;
  top: calc(var(--nav-h) + 20px);
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}

.form-card {
  padding: 24px 26px 26px;
  border-radius: var(--r-xl);
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  box-shadow: var(--sh-2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.form-card__head {

  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: 18px;
}

.form-card__title {
  font-size: 18px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-4);
}

.form-grid .span-2 {
  grid-column: 1 / -1;
}

.form-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  align-items: center;
  padding-top: var(--sp-2);
}

.form-actions .btn {
  min-width: 128px;
}

.form-error-summary {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 600;
  color: var(--c-danger);
  background: var(--c-danger-soft);
  border: 1px solid rgba(194, 86, 92, 0.3);
}

.form-error-summary.is-visible {

}

.form-error-summary svg {
  width: 18px;
  height: 18px;
  flex: none;
}

/* 侧栏提示列表 */
.hint-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 13px;
  line-height: 1.75;
  color: var(--c-ink-2);
}

.hint-list li {
  position: relative;
  padding-left: 18px;
}

.hint-list li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 10px;
  width: 6px;
  height: 6px;
  border-radius: var(--r-full);
  background: var(--g-primary);
}

/* --------------------------------------------------------------------------

   -------------------------------------------------------------------------- */
.page-main {
  min-height: calc(100vh - var(--nav-h) - 200px);
}

.breadcrumb {

  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--c-ink-3);
  padding: var(--sp-5) 0 0;
}

.breadcrumb a:hover {
  color: var(--c-ink);
}

/* --------------------------------------------------------------------------
   响应式
   -------------------------------------------------------------------------- */
@media (max-width: 1023px) {
  .recipe-grid,
  .category-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .carousel__media {
    aspect-ratio: 16 / 9;
  }

  .carousel__overlay {
    padding: 30px 30px 62px;
  }

  .detail-body,
  .form-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .detail-side,
  .form-side {
    position: static;
  }

  .detail-hero__media {
    aspect-ratio: 16 / 9;
  }

  .site-nav__search {
    display: none;
  }
}

@media (max-width: 767px) {
  :root {
    --nav-h: 60px;
    --sp-8: 44px;
  }

  .container {
    padding: 0 var(--sp-4);
  }

  .recipe-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--sp-4);
  }

  .brand__sub {
    display: none;
  }

  .home-section__title {
    font-size: 19px;
  }

  .carousel__viewport {
    border-radius: var(--r-lg);
  }

  .carousel__media {
    aspect-ratio: 4 / 3;
  }

  .carousel__overlay {
    gap: 6px;
    padding: 20px 18px 58px;
  }

  .carousel__desc {
    -webkit-line-clamp: 3;
    line-clamp: 3;
  }

  .carousel__nav {
    display: none;
  }

  .carousel__progress {
    top: 12px;
    left: 16px;
    right: 16px;
  }

  .carousel__dots {
    gap: 7px;
    bottom: 20px;
  }

  .carousel__toggle {
    right: 14px;
    bottom: 15px;
    width: 34px;
    height: 34px;
  }

  .category-card {
    gap: 12px;
    padding: 15px 16px;
  }

  .category-card__icon {
    width: 42px;
    height: 42px;
  }

  .category-card__icon svg {
    width: 21px;
    height: 21px;
  }

  .meta-bar {
    grid-template-columns: repeat(2, 1fr);
  }

  .detail-hero {
    border-radius: var(--r-lg);
  }

  .detail-hero__content {
    padding: 20px;
  }

  .detail-block,
  .form-card {
    padding: 20px 18px 22px;
    border-radius: var(--r-lg);
  }

  .form-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .ingredient-row {
    grid-template-columns: 1fr 1fr 42px;
  }

  .step-card {
    grid-template-columns: 36px 1fr;
    gap: 12px;
  }

  .step-card__dot {
    width: 34px;
    height: 34px;
    font-size: 13px;
  }

  .step-row .uploader--mini {
    max-width: 100%;
  }

  .form-actions {
    position: sticky;
    bottom: 0;
    z-index: 60;
    padding: 12px 0;
    background: linear-gradient(to top, rgba(255, 251, 245, 0.98) 62%, rgba(255, 251, 245, 0));
  }

  .form-actions .btn {
    flex: 1;
    min-width: 0;
  }

  .site-footer__inner {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (max-width: 420px) {
  .ingredient-row {
    grid-template-columns: 1fr 42px;
  }
}

(function (window, document) {

     ------------------------------------------------------------------------ */
  var ESCAPE_MAP = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';

  /* ------------------------------------------------------------------------

  /** 分钟 → 「45 分钟」/「1 小时」/「1 小时 30 分钟」 */
  function formatTime(minutes) {
    var m = Number(minutes);
    if (!isFinite(m) || m <= 0) return '—';
    if (m < 60) return m + ' 分钟';
    var h = Math.floor(m / 60);
    var rest = m % 60;
    return rest === 0 ? h + ' 小时' : h + ' 小时 ' + rest + ' 分钟';
  }

  /** 时间戳 → 「今天」/「3 天前」/「2026-01-08」 */
  function formatDate(timestamp) {
    var ts = Number(timestamp);
    if (!isFinite(ts) || ts <= 0) return '';
    var now = Date.now();
    var diff = now - ts;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 7 * 24 * 60 * 60 * 1000) return Math.floor(diff / 86400000) + ' 天前';
    var d = new Date(ts);
    var pad = function (n) {
      return n < 10 ? '0' + n : String(n);
    };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /** 难度 → 徽章样式类 */
  function difficultyClass(level) {
    if (level === '简单') return 'badge--easy';
    if (level === '困难') return 'badge--hard';
    return 'badge--medium';
  }

  /* ------------------------------------------------------------------------

     ------------------------------------------------------------------------ */
  function debounce(fn, wait) {
    var timer = null;
    return function () {
      var context = this;
      var args = arguments;
      if (timer) window.clearTimeout(timer);
      timer = window.setTimeout(function () {
        timer = null;
        fn.apply(context, args);
      }, wait || 200);
    };
  }

  /** 生成唯一 id */
  function uid(prefix) {
    return (
      (prefix || 'usr-') +
      Date.now().toString(36) +

      Math.random().toString(36).slice(2, 7)
    );
  }

  /** 读取 URL 查询参数（file:// 下 location.search 同样可用） */
  function getQueryParam(name, fallback) {
    var search = window.location.search || '';
    if (search.charAt(0) === '?') search = search.slice(1);
    if (!search) return fallback === undefined ? null : fallback;
    var pairs = search.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var idx = pairs[i].indexOf('=');
      var key = idx === -1 ? pairs[i] : pairs[i].slice(0, idx);
      if (decodeURIComponent(key.replace(/\+/g, ' ')) === name) {
        var raw = idx === -1 ? '' : pairs[i].slice(idx + 1);
        return decodeURIComponent(raw.replace(/\+/g, ' '));
      }
    }
    return fallback === undefined ? null : fallback;
  }

  /* ------------------------------------------------------------------------
     DOM 简写
     ------------------------------------------------------------------------ */
  function $(selector, root) {
    return (root || document).querySelector(selector);
  }

  function $$(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));

  /** 平滑滚动到元素并聚焦第一个可输入控件 */
  function scrollToEl(el) {

    var top = el.getBoundingClientRect().top + window.pageYOffset - 110;
    window.scrollTo({ top: top < 0 ? 0 : top, behavior: 'smooth' });

    book:

  /** 生成一个内联 SVG 图标 */
  function icon(name, extraClass) {
    var inner = ICON_PATHS[name] || ICON_PATHS.sparkle;

  }

  /* ------------------------------------------------------------------------
     封面图渲染
     统一规则：占位层始终存在，图片加载成功后再淡入覆盖。
     这样即使没有图片、断网或链接失效，也永远不会出现破图。
     ------------------------------------------------------------------------ */
  function fallbackHtml(recipe, size) {
    return (
      '<div class="media-fallback' +
      (size === 'sm' ? ' media-fallback--sm' : size === 'lg' ? ' media-fallback--lg' : '') +
      '">' +
      '<span class="media-fallback__emoji">' +
      escapeHtml(recipe && recipe.emoji ? recipe.emoji : '🍽️') +
      '</span>' +
      '<span class="media-fallback__text">' +
      escapeHtml(recipe && recipe.title ? recipe.title : '美味') +
      '</span>' +
      '</div>'
    );
  }

  /**
   * 生成封面容器 HTML。
   * @param {object} recipe 菜谱对象
   * @param {object} [options] { extraClass, size, alt, overlay }
   *   overlay：需要叠在封面上层的 HTML 片段（例如卡片右下角的时长标签）
   */
  function coverHtml(recipe, options) {
    var opts = options || {};
    var title = (recipe && recipe.title) || '菜谱图片';
    var html =
      '<div class="media ' +
      escapeHtml(opts.extraClass || '') +
      '">' +
      fallbackHtml(recipe, opts.size);

    if (recipe && recipe.cover) {
      html +=
        '<img src="' +
        escapeHtml(recipe.cover) +
        '" alt="' +
        escapeHtml(opts.alt || title) +
        '" loading="lazy" onload="App.Utils.onImgLoad(this)" ' +
        'onerror="App.Utils.onImgError(this)">';
    }

    if (opts.overlay) html += opts.overlay;

    return html + '</div>';
  }

  /** 图片加载成功 → 淡入 */
  function onImgLoad(img) {
    var parent = img.parentNode;
    if (parent && parent.classList) parent.classList.add('is-loaded');
  }

  /** 图片加载失败 → 移除图片节点，露出下层占位图 */
  function onImgError(img) {
    var parent = img.parentNode;
    if (parent && parent.classList) parent.classList.remove('is-loaded');
    console.warn('[image] 图片加载失败，已回退占位图：' + (img.getAttribute('src') || '').slice(0, 60));

    // 步骤图等没有占位层的位置，直接移除整个容器，避免留下空框
    var removeSelector = img.getAttribute('data-error-remove');
    var target = img;
    if (removeSelector && img.closest) {
      var host = img.closest(removeSelector);
      if (host) target = host;
    }
    if (target.parentNode) target.parentNode.removeChild(target);
  }

  /* ------------------------------------------------------------------------

  var toastHost = null;

      toastHost.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastHost);
    }
    return toastHost;
  }

    var node = document.createElement('div');
    var kind = type === 'success' ? 'toast--success' : type === 'error' ? 'toast--error' : '';

    node.innerHTML =
      (type === 'success' ? icon('check') : type === 'error' ? icon('alert') : '') +
      '<span>' +
      escapeHtml(message) +
      '</span>';
    host.appendChild(node);

    var life = duration || (type === 'error' ? 3600 : 2200);
    window.setTimeout(function () {
      node.classList.add('is-leaving');
      window.setTimeout(function () {
        if (node.parentNode) node.parentNode.removeChild(node);

        '<div class="dialog__icon">' +

        '<h3 class="dialog__title">' +
        escapeHtml(opts.title || '确认操作') +

        '<p class="dialog__text">' +
        escapeHtml(opts.text || '该操作不可撤销，确定要继续吗？') +
        '</p>' +
        '<div class="dialog__actions">' +
        '<button type="button" class="btn btn--ghost" data-act="cancel">' +
        escapeHtml(opts.cancelText || '取消') +
        '</button>' +
        '<button type="button" class="btn ' +
        (opts.danger ? 'btn--danger' : 'btn--primary') +
        '" data-act="ok">' +
        escapeHtml(opts.okText || '确定') +
        '</button>' +
        '</div></div>';

      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';

      var finish = function (result) {
        document.body.style.overflow = '';
        document.removeEventListener('keydown', onKey);
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        resolve(result);
      };

      var onKey = function (event) {
        if (event.key === 'Escape') finish(false);
      };

      overlay.addEventListener('click', function (event) {
        var act = event.target.getAttribute && event.target.getAttribute('data-act');
        if (act === 'ok') finish(true);
        else if (act === 'cancel' || event.target === overlay) finish(false);
      });

      document.addEventListener('keydown', onKey);

      window.requestAnimationFrame(function () {
        overlay.classList.add('is-open');
        var okBtn = overlay.querySelector('[data-act="ok"]');
        if (okBtn) okBtn.focus();
      });
    });
  }

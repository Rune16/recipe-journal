<script>
// ===== js/storage.js =====
/* ==========================================================================
   食谱集 · js/storage.js
   存储层：内置数据 + 用户自建数据（localStorage）的合并、读写、删除与配额处理
   ========================================================================== */

(function (window) {
  'use strict';

  var App = window.App;

  var STORAGE_KEY = 'minicrm.recipes.custom.v1';

  /** 用户自建数据的缓存（失效后重新读取） */
  var cache = null;
  /** 读取失败时的提示信息，供页面消费一次 */
  var readErrorMessage = '';

  /* ------------------------------------------------------------------------
     校验与规范化：外部写入的数据可能被手工改坏，这里做一次兜底
     ------------------------------------------------------------------------ */
  function isValidRecipe(raw) {
    return (
      raw &&
      typeof raw === 'object' &&
      typeof raw.id === 'string' &&
      raw.id.length > 0 &&
      typeof raw.title === 'string'
    );
  }

  function toStringArray(value) {
    if (!Array.isArray(value)) return [];
    var result = [];
    value.forEach(function (item) {
      if (typeof item !== 'string') return;
      var text = item.trim();
      if (text === '' || result.indexOf(text) !== -1) return;
      result.push(text);
    });
    return result;
  }

  function normalizeIngredients(value) {
    if (!Array.isArray(value)) return [];
    return value
      .map(function (item) {
        return {
          name: String((item && item.name) || '').trim(),
          amount: String((item && item.amount) || '').trim()
        };
      })
      .filter(function (item) {
        return item.name !== '';
      });
  }

  function normalizeSteps(value) {
    if (!Array.isArray(value)) return [];
    return value
      .map(function (item) {
        if (typeof item === 'string') return { text: item.trim(), image: '' };
        return {
          text: String((item && item.text) || '').trim(),
          image: String((item && item.image) || '')
        };
      })
      .filter(function (item) {
        return item.text !== '';
      });
  }

  function normalize(raw) {
    var time = Number(raw.timeMinutes);
    var servings = Number(raw.servings);
    return {
      id: String(raw.id),
      title: String(raw.title || '').trim(),
      emoji: typeof raw.emoji === 'string' && raw.emoji ? raw.emoji : '🍽️',
      cover: typeof raw.cover === 'string' ? raw.cover : '',
      category: typeof raw.category === 'string' && raw.category ? raw.category : '家常菜',
      tags: toStringArray(raw.tags),
      difficulty:
        raw.difficulty === '简单' || raw.difficulty === '困难' ? raw.difficulty : '中等',
      timeMinutes: isFinite(time) && time > 0 ? Math.round(time) : 0,
      servings: isFinite(servings) && servings > 0 ? Math.round(servings) : 1,
      description: String(raw.description || '').trim(),
      ingredients: normalizeIngredients(raw.ingredients),
      steps: normalizeSteps(raw.steps),
      tips: String(raw.tips || '').trim(),
      createdAt: isFinite(Number(raw.createdAt)) && Number(raw.createdAt) > 0
        ? Number(raw.createdAt)
        : Date.now(),
      isCustom: raw.isCustom === true
    };
  }

  /* ------------------------------------------------------------------------
     底层读写
     ------------------------------------------------------------------------ */
  function getSeeds() {
    return Array.isArray(window.SEED_RECIPES) ? window.SEED_RECIPES : [];
  }

  function findSeed(id) {
    var seeds = getSeeds();
    for (var i = 0; i < seeds.length; i++) {
      if (seeds[i].id === id) return seeds[i];
    }
    return null;
  }

  function readCustom() {
    if (cache) return cache;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        cache = [];
        return cache;
      }
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('数据结构不是数组');
      cache = parsed.filter(isValidRecipe).map(normalize);
      return cache;
    } catch (err) {
      console.warn('[storage] 读取本地菜谱失败，已回退为仅内置数据：', err && err.message);
      readErrorMessage = '本地保存的数据无法解析，已临时回退为内置菜谱。';
      cache = [];
      return cache;
    }
  }

  /** 写入 localStorage，并把配额错误转换成可展示的提示 */
  function writeCustom(list) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      cache = list;
    } catch (err) {
      var isQuota =
        err &&
        (err.name === 'QuotaExceededError' ||
          err.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
          err.code === 22 ||
          err.code === 1014);
      console.warn('[storage] 写入本地菜谱失败：', err && err.name, err && err.message);
      if (isQuota) {
        throw new Error('本地存储空间已满，请删除部分自建菜谱或使用更小的图片。');
      }
      throw new Error('保存失败，浏览器本地存储不可用（是否处于隐私模式？）。');
    }
  }

  /* ------------------------------------------------------------------------
     对外接口
     ------------------------------------------------------------------------ */

  /**
   * 全部菜谱：内置 + 用户自建。
   * 同 id 时用户数据覆盖内置数据（用于「编辑内置菜谱生成覆盖记录」）。
   * 排序：创建时间由新到旧。
   */
  function getAll() {
    var map = {};
    var order = [];

    getSeeds().forEach(function (seed) {
      var recipe = normalize(seed);
      map[recipe.id] = recipe;
      order.push(recipe.id);
    });

    readCustom().forEach(function (recipe) {
      if (!Object.prototype.hasOwnProperty.call(map, recipe.id)) order.push(recipe.id);
      map[recipe.id] = recipe;
    });

    return order
      .map(function (id) {
        return map[id];
      })
      .sort(function (a, b) {
        return b.createdAt - a.createdAt;
      });
  }

  function getById(id) {
    if (!id) return null;
    var custom = readCustom();
    for (var i = 0; i < custom.length; i++) {
      if (custom[i].id === id) return custom[i];
    }
    var seed = findSeed(id);
    return seed ? normalize(seed) : null;
  }

  /** 该 id 是否被用户数据覆盖（内置菜谱被编辑过 / 用户自建） */
  function isOverridden(id) {
    if (!id) return false;
    return readCustom().some(function (item) {
      return item.id === id;
    });
  }

  /**
   * 新增或更新一条菜谱。
   * - 没有 id：创建用户自建菜谱
   * - id 命中用户数据：覆盖更新
   * - id 命中内置数据：写入一条覆盖记录（内置菜谱得以"被编辑"）
   * @returns {object} 落库后的完整菜谱对象
   */
  function save(input) {
    if (!input || typeof input !== 'object') {
      throw new Error('没有可保存的菜谱数据。');
    }
    if (!String(input.title || '').trim()) {
      throw new Error('菜谱名称不能为空。');
    }

    var list = readCustom().slice();
    var id = String(input.id || '').trim();
    var seed = id ? findSeed(id) : null;
    var isNew = id === '';

    var record = normalize(
      Object.assign({}, input, {
        id: id || App.Utils.uid('usr-'),
        isCustom: seed ? false : isNew ? true : input.isCustom === true,
        createdAt: seed
          ? normalize(seed).createdAt
          : isFinite(Number(input.createdAt)) && Number(input.createdAt) > 0
          ? Number(input.createdAt)
          : Date.now()
      })
    );

    var replaced = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === record.id) {
        list[i] = record;
        replaced = true;
        break;
      }
    }
    if (!replaced) list.push(record);

    writeCustom(list);
    return record;
  }

  /**
   * 删除菜谱。仅允许删除用户自建数据；内置菜谱未被编辑过时不可删除。
   * @returns {boolean} 是否删除成功
   */
  function remove(id) {
    var list = readCustom();
    var next = list.filter(function (item) {
      return item.id !== id;
    });
    if (next.length === list.length) return false;
    writeCustom(next);
    return true;
  }

  /** 清空全部用户数据，恢复到初始的内置示例状态 */
  function clearCustom() {
    try {
      window.localStorage.removeItem(STORAGE_KEY);
    } catch (err) {
      console.warn('[storage] 清空本地数据失败：', err && err.message);
      throw new Error('清空失败，浏览器本地存储不可用。');
    }
    cache = [];
  }

  function customCount() {
    return readCustom().length;
  }

  function seedCount() {
    return getSeeds().length;
  }

  /** 当前占用的存储字节数（近似值，用于容量提示） */
  function getUsageBytes() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? raw.length : 0;
    } catch (err) {
      return 0;
    }
  }

  /** 取走一次读取错误提示（取走后清空，避免重复弹出） */
  function consumeReadError() {
    var message = readErrorMessage;
    readErrorMessage = '';
    return message;
  }

  App.Storage = {
    STORAGE_KEY: STORAGE_KEY,
    getAll: getAll,
    getById: getById,
    save: save,
    remove: remove,
    clearCustom: clearCustom,
    isOverridden: isOverridden,
    customCount: customCount,
    seedCount: seedCount,
    getUsageBytes: getUsageBytes,
    consumeReadError: consumeReadError
  };
})(window);

</script>
<script>
// ===== js/list.js =====
/* ==========================================================================
   食谱集 · js/list.js
   首页逻辑：精选轮播图 / 菜谱分类 / 热门菜谱 / 关键词筛选 / 空状态 / 数据重置
   ========================================================================== */

(function (window, document) {
  'use strict';

  var App = window.App;
  var U = App.Utils;
  var S = App.Storage;

  var ALL = '全部';

  /* 首页各区块的展示条数 */
  var CAROUSEL_SIZE = 4; // 轮播图取热度前 4 道
  var HOT_SIZE = 8; // 热门榜取热度前 8 道
  var AUTOPLAY_MS = 5200; // 轮播自动播放间隔

  /* ------------------------------------------------------------------------
     页面元素（不存在则直接退出，保证任何页面单独打开都不报错）
     ------------------------------------------------------------------------ */
  var grid = U.$('#recipeGrid');
  if (!grid) return;

  var navInput = U.$('#navSearchInput');
  var navBox = U.$('#navSearchBox');

  var carouselEl = U.$('#carousel');
  var carouselTrack = U.$('#carouselTrack');
  var carouselPrev = U.$('#carouselPrev');
  var carouselNext = U.$('#carouselNext');
  var carouselToggle = U.$('#carouselToggle');
  var carouselDots = U.$('#carouselDots');
  var carouselProgress = U.$('#carouselProgress');

  var categoryGrid = U.$('#categoryGrid');
  var categoryTotal = U.$('#categoryTotal');

  var recipeSection = U.$('.home-section--recipes');
  var sectionTitle = U.$('#recipeSectionTitle');
  var sectionSub = U.$('#recipeSectionSub');
  var countEl = U.$('#resultCount');
  var resetFiltersBtn = U.$('#resetFilters');
  var emptyEl = U.$('#emptyState');
  var emptyResetBtn = U.$('#emptyReset');

  var footerSummary = U.$('#footerSummary');
  var resetDataBtn = U.$('#resetData');

  /* ------------------------------------------------------------------------
     状态
     ------------------------------------------------------------------------ */
  var state = { category: ALL, keyword: '' };
  var allRecipes = [];
  var hotRanked = [];
  var carouselItems = [];

  /* ------------------------------------------------------------------------
     分类元信息：内联图标 + 水印菜品 + 一句话说明
     （图标取自 js/utils.js 的 ICON_PATHS，不使用外部图标库）
     ------------------------------------------------------------------------ */
  var CATEGORY_META = {
    川菜: { icon: 'flame', emoji: '🥘', desc: '麻辣鲜香' },
    粤菜: { icon: 'fish', emoji: '🐟', desc: '清鲜本味' },
    家常菜: { icon: 'chef', emoji: '🍖', desc: '下饭硬菜' },
    汤羹: { icon: 'soup', emoji: '🍲', desc: '慢炖暖胃' },
    甜品: { icon: 'cake', emoji: '🍮', desc: '甜汤点心' },
    素食: { icon: 'leaf', emoji: '🥦', desc: '清爽低脂' }
  };
  var DEFAULT_META = { icon: 'sparkle', emoji: '🍽️', desc: '更多风味' };

  /* ------------------------------------------------------------------------
     热度启发式
     数据里没有浏览量字段，因此用「标签权重 + 步骤/用料丰富度 + 是否本人创建」
     综合打分；同分时按创建时间由新到旧。规则写在这里，避免凭空排序。
     ------------------------------------------------------------------------ */
  var HOT_TAGS = {
    经典: 3,
    宴客: 3,
    硬菜: 3,
    滋补: 3,
    下饭: 2,
    快手: 2,
    鲜味: 2,
    高蛋白: 2,
    港式: 2,
    暖胃: 2,
    新手友好: 1,
    低脂: 1,
    清淡: 1,
    酸甜: 1,
    微辣: 1,
    慢炖: 1,
    润燥: 1,
    甜汤: 1,
    冷热皆宜: 1,
    夏日: 1,
    冰爽: 1,
    素食: 1
  };

  function heatScore(recipe) {
    var score = 0;
    (recipe.tags || []).forEach(function (tag) {
      if (HOT_TAGS[tag]) score += HOT_TAGS[tag];
    });
    // 步骤多于 4 步的，说明做法更值得细看，最多再加 3 分
    score += Math.min(Math.max(recipe.steps.length - 4, 0), 3);
    // 用料齐全（6 种以上）再加 1 分
    if (recipe.ingredients.length >= 6) score += 1;
    // 用户自己创建的菜谱优先展示
    if (recipe.isCustom) score += 2;
    return score;
  }

  function rankByHeat(list) {
    return list.slice().sort(function (a, b) {
      var diff = heatScore(b) - heatScore(a);
      if (diff !== 0) return diff;
      return b.createdAt - a.createdAt;
    });
  }

  /* ------------------------------------------------------------------------
     数据读取
     ------------------------------------------------------------------------ */
  function loadData() {
    allRecipes = S.getAll();
    var readError = S.consumeReadError();
    if (readError) U.toast(readError, 'error', 4200);
  }

  /* ------------------------------------------------------------------------
     关键词匹配：菜名、简介、分类、标签、食材名、小贴士
     ------------------------------------------------------------------------ */
  function normalize(text) {
    return String(text || '').toLowerCase();
  }

  function matchesKeyword(recipe, keyword) {
    if (!keyword) return true;
    if (recipe._haystack === undefined) {
      var parts = [recipe.title, recipe.category, recipe.description, recipe.tips]
        .concat(recipe.tags)
        .concat(
          recipe.ingredients.map(function (item) {
            return item.name;
          })
        );
      recipe._haystack = normalize(parts.join(' '));
    }
    return recipe._haystack.indexOf(keyword) !== -1;
  }

  /* ------------------------------------------------------------------------
     轮播图
     ------------------------------------------------------------------------ */
  var slideIndex = 0;
  var slideTimer = null;
  var userPaused = false; // 用户点了暂停
  var interactionPaused = false; // 悬停 / 聚焦 / 页面不可见
  var canAutoPlay = false; // 是否允许自动播放（多于一张且未开启减弱动效）

  function prefersReducedMotion() {
    return !!(
      window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
    );
  }

  function carouselMetaItem(iconName, text) {
    return (
      '<span class="carousel__meta-item">' +
      U.icon(iconName) +
      U.escapeHtml(text) +
      '</span>'
    );
  }

  function slideHtml(recipe, index, total) {
    var overlay =
      '<div class="carousel__overlay">' +
      '<span class="badge badge--category carousel__badge">' +
      U.escapeHtml(recipe.category) +
      '</span>' +
      '<h3 class="carousel__title">' +
      U.escapeHtml(recipe.title) +
      '</h3>' +
      '<p class="carousel__desc">' +
      U.escapeHtml(recipe.description || '这道菜还没有写简介，点开看看做法吧。') +
      '</p>' +
      '<div class="carousel__meta">' +
      carouselMetaItem('clock', U.formatTime(recipe.timeMinutes)) +
      carouselMetaItem('chef', recipe.difficulty) +
      carouselMetaItem(
        'book',
        recipe.steps.length ? recipe.steps.length + ' 个步骤' : '步骤待补充'
      ) +
      '</div>' +
      '<span class="btn btn--primary carousel__cta">查看做法' +
      U.icon('chevronRight') +
      '</span>' +
      '</div>';

    return (
      '<article class="carousel__slide" role="group" aria-roledescription="幻灯片" aria-label="' +
      (index + 1) +
      ' / ' +
      total +
      '">' +
      '<a class="carousel__link" href="detail.html?id=' +
      encodeURIComponent(recipe.id) +
      '">' +
      U.coverHtml(recipe, { extraClass: 'carousel__media', size: 'lg', overlay: overlay }) +
      '</a></article>'
    );
  }

  function renderDots() {
    if (!carouselDots) return;
    carouselDots.innerHTML = carouselItems
      .map(function (recipe, index) {
        var active = index === slideIndex;
        return (
          '<button type="button" class="carousel__dot' +
          (active ? ' is-active' : '') +
          '" data-index="' +
          index +
          '" aria-label="查看第 ' +
          (index + 1) +
          ' 张：' +
          U.escapeHtml(recipe.title) +
          '" aria-current="' +
          (active ? 'true' : 'false') +
          '"></button>'
        );
      })
      .join('');
  }

  function updateToggle() {
    if (!carouselToggle) return;
    carouselToggle.innerHTML = U.icon(userPaused ? 'play' : 'pause');
    carouselToggle.setAttribute('aria-pressed', userPaused ? 'true' : 'false');
    carouselToggle.setAttribute(
      'aria-label',
      userPaused ? '继续自动播放精选菜谱' : '暂停自动播放精选菜谱'
    );
  }

  function clearSlideTimer() {
    if (slideTimer) {
      window.clearTimeout(slideTimer);
      slideTimer = null;
    }
  }

  /** 让进度条动画从头开始（改一次 inline 样式以强制重启动画） */
  function restartProgress() {
    if (!carouselProgress) return;
    carouselProgress.style.animation = 'none';
    // 读取一次布局属性，强制浏览器重排后动画才会重新播放
    void carouselProgress.offsetWidth;
    carouselProgress.style.animation = '';
  }

  function isAutoPlaying() {
    return canAutoPlay && !userPaused;
  }

  /** 同步播放状态与计时器：暂停时冻结进度条，播放时从头计时 */
  function syncCarousel() {
    if (!carouselEl) return;

    var playing = isAutoPlaying();
    carouselEl.classList.toggle('is-playing', playing);
    carouselEl.classList.toggle('is-paused', playing && interactionPaused);

    clearSlideTimer();
    updateToggle();

    if (!playing || interactionPaused) return;

    restartProgress();
    slideTimer = window.setTimeout(function () {
      goTo(slideIndex + 1);
    }, AUTOPLAY_MS);
  }

  function goTo(next) {
    var total = carouselItems.length;
    if (!carouselEl || total === 0) return;

    slideIndex = ((next % total) + total) % total;
    if (carouselTrack) {
      carouselTrack.style.transform = 'translateX(' + -slideIndex * 100 + '%)';
    }
    renderDots();
    syncCarousel();
  }

  function buildCarousel(items) {
    carouselItems = items;
    slideIndex = 0;
    clearSlideTimer();

    if (!carouselEl || !carouselTrack) return;

    if (items.length === 0) {
      carouselTrack.innerHTML = '';
      carouselEl.classList.add('is-single', 'hidden');
      return;
    }

    carouselEl.classList.remove('hidden');
    carouselEl.classList.toggle('is-single', items.length < 2);
    carouselTrack.style.transform = 'translateX(0%)';
    carouselTrack.innerHTML = items
      .map(function (recipe, index) {
        return slideHtml(recipe, index, items.length);
      })
      .join('');

    if (carouselProgress) {
      carouselProgress.style.setProperty('--carousel-duration', AUTOPLAY_MS + 'ms');
    }

    renderDots();
    syncCarousel();
  }

  function bindCarousel() {
    if (!carouselEl) return;

    U.on(carouselPrev, 'click', function () {
      goTo(slideIndex - 1);
    });

    U.on(carouselNext, 'click', function () {
      goTo(slideIndex + 1);
    });

    U.on(carouselDots, 'click', function (event) {
      var dot = event.target.closest ? event.target.closest('.carousel__dot') : null;
      if (!dot) return;
      goTo(Number(dot.getAttribute('data-index')) || 0);
    });

    U.on(carouselToggle, 'click', function () {
      userPaused = !userPaused;
      syncCarousel();
    });

    // 悬停或焦点进入时暂停，离开后恢复
    U.on(carouselEl, 'mouseenter', function () {
      interactionPaused = true;
      syncCarousel();
    });
    U.on(carouselEl, 'mouseleave', function () {
      interactionPaused = false;
      syncCarousel();
    });
    U.on(carouselEl, 'focusin', function () {
      interactionPaused = true;
      syncCarousel();
    });
    U.on(carouselEl, 'focusout', function () {
      interactionPaused = false;
      syncCarousel();
    });

    // 键盘左右键（事件从内部的按钮 / 链接冒泡上来）
    U.on(carouselEl, 'keydown', function (event) {
      if (event.key === 'ArrowLeft') {
        goTo(slideIndex - 1);
        event.preventDefault();
      } else if (event.key === 'ArrowRight') {
        goTo(slideIndex + 1);
        event.preventDefault();
      }
    });

    // 触摸滑动
    var touchStartX = null;
    U.on(
      carouselEl,
      'touchstart',
      function (event) {
        touchStartX = event.touches && event.touches[0] ? event.touches[0].clientX : null;
      },
      { passive: true }
    );
    U.on(
      carouselEl,
      'touchend',
      function (event) {
        if (touchStartX === null) return;
        var endX =
          event.changedTouches && event.changedTouches[0]
            ? event.changedTouches[0].clientX
            : null;
        if (endX !== null) {
          var delta = endX - touchStartX;
          if (Math.abs(delta) > 40) {
            goTo(delta < 0 ? slideIndex + 1 : slideIndex - 1);
          }
        }
        touchStartX = null;
      },
      { passive: true }
    );

    // 页面切到后台时暂停，回来再继续
    U.on(document, 'visibilitychange', function () {
      interactionPaused = !!document.hidden;
      syncCarousel();
    });
  }

  /* ------------------------------------------------------------------------
     菜谱分类卡片
     ------------------------------------------------------------------------ */
  function categoryList() {
    var order = (window.SEED_CATEGORIES || []).slice();
    allRecipes.forEach(function (recipe) {
      if (recipe.category && order.indexOf(recipe.category) === -1) order.push(recipe.category);
    });
    return order;
  }

  function countByCategory(category) {
    return allRecipes.filter(function (recipe) {
      return recipe.category === category;
    }).length;
  }

  function renderCategories() {
    if (!categoryGrid) return;

    var list = categoryList();

    categoryGrid.innerHTML = list
      .map(function (category) {
        var meta = CATEGORY_META[category] || DEFAULT_META;
        var active = state.category === category;
        return (
          '<button type="button" class="category-card' +
          (active ? ' is-active' : '') +
          '" data-category="' +
          U.escapeHtml(category) +
          '" aria-pressed="' +
          (active ? 'true' : 'false') +
          '">' +
          '<span class="category-card__icon">' +
          U.icon(meta.icon) +
          '</span>' +
          '<span class="category-card__body">' +
          '<span class="category-card__name">' +
          U.escapeHtml(category) +
          '</span>' +
          '<span class="category-card__count">' +
          countByCategory(category) +
          ' 道 · ' +
          U.escapeHtml(meta.desc) +
          '</span>' +
          '</span>' +
          '<span class="category-card__watermark" aria-hidden="true">' +
          U.escapeHtml(meta.emoji) +
          '</span>' +
          '</button>'
        );
      })
      .join('');

    if (categoryTotal) categoryTotal.textContent = list.length + ' 个分类';
  }

  /* ------------------------------------------------------------------------
     菜谱卡片
     ------------------------------------------------------------------------ */
  function cardHtml(recipe, index) {
    var stepsText = recipe.steps.length ? recipe.steps.length + ' 步' : '步骤待补充';
    var desc = recipe.description || '这道菜还没有写简介，点开看看做法吧。';

    var overlay =
      '<span class="recipe-card__time">' +
      U.icon('clock') +
      U.escapeHtml(U.formatTime(recipe.timeMinutes)) +
      '</span>';

    return (
      '<article class="recipe-card" style="animation-delay:' +
      Math.min(index, 8) * 40 +
      'ms">' +
      '<a class="recipe-card__link" href="detail.html?id=' +
      encodeURIComponent(recipe.id) +
      '">' +
      U.coverHtml(recipe, { extraClass: 'recipe-card__media', overlay: overlay }) +
      '<div class="recipe-card__body">' +
      '<h3 class="recipe-card__title">' +
      U.escapeHtml(recipe.title) +
      '</h3>' +
      '<p class="recipe-card__desc">' +
      U.escapeHtml(desc) +
      '</p>' +
      '<div class="recipe-card__meta">' +
      '<span class="badge ' +
      U.difficultyClass(recipe.difficulty) +
      '">' +
      U.escapeHtml(recipe.difficulty) +
      '</span>' +
      '<span class="badge badge--category">' +
      U.escapeHtml(recipe.category) +
      '</span>' +
      (recipe.isCustom ? '<span class="badge badge--custom">我的</span>' : '') +
      '<span class="recipe-card__steps-hint">' +
      U.escapeHtml(stepsText) +
      '</span>' +
      '</div></div></a></article>'
    );
  }

  /* ------------------------------------------------------------------------
     菜谱列表
     ------------------------------------------------------------------------ */
  /** 当前该展示哪些菜谱：关键词 > 分类 > 热门榜默认视图 */
  function visibleList() {
    var keyword = normalize(state.keyword).trim();
    var inCategory =
      state.category === ALL
        ? allRecipes
        : allRecipes.filter(function (recipe) {
            return recipe.category === state.category;
          });

    if (keyword) {
      return inCategory.filter(function (recipe) {
        return matchesKeyword(recipe, keyword);
      });
    }
    if (state.category === ALL) return hotRanked.slice(0, HOT_SIZE);
    return inCategory;
  }

  function render() {
    var list = visibleList();
    var keyword = state.keyword.trim();

    grid.innerHTML = list.map(cardHtml).join('');
    grid.classList.toggle('hidden', list.length === 0);

    if (emptyEl) emptyEl.classList.toggle('hidden', list.length !== 0);

    if (sectionTitle) {
      sectionTitle.textContent = keyword
        ? '搜索结果'
        : state.category === ALL
        ? '热门菜谱'
        : state.category;
    }

    if (sectionSub) {
      if (keyword) {
        sectionSub.textContent = '包含「' + keyword + '」的菜谱，共 ' + list.length + ' 道。';
      } else if (state.category === ALL) {
        sectionSub.textContent = '大家都在做的高人气菜谱，跟着步骤来不容易失手。';
      } else {
        sectionSub.textContent = '「' + state.category + '」分类下的菜谱，点开就能看分步做法。';
      }
    }

    if (countEl) countEl.textContent = '共 ' + list.length + ' 道菜谱';

    if (resetFiltersBtn) {
      resetFiltersBtn.classList.toggle('hidden', state.category === ALL && !keyword);
    }
  }

  function renderFooter() {
    var totalSteps = allRecipes.reduce(function (sum, recipe) {
      return sum + recipe.steps.length;
    }, 0);
    if (footerSummary) {
      footerSummary.textContent =
        '共 ' + allRecipes.length + ' 道菜谱、' + totalSteps + ' 个做菜步骤，数据保存在本机浏览器中。';
    }
  }

  /* ------------------------------------------------------------------------
     筛选
     ------------------------------------------------------------------------ */
  function setKeyword(value) {
    state.keyword = value;
    if (navInput && navInput.value !== value) navInput.value = value;
    syncSearchBox();
  }

  function syncSearchBox() {
    if (!navBox) return;
    navBox.classList.toggle('is-filled', !!(navInput && navInput.value));
  }

  function resetFilters(scroll) {
    state.category = ALL;
    setKeyword('');
    renderCategories();
    render();
    if (scroll) U.scrollToEl(recipeSection);
  }

  var applyKeyword = U.debounce(function () {
    render();
  }, 200);

  function bindEvents() {
    // 分类卡片：再次点击当前分类可取消筛选
    U.on(categoryGrid, 'click', function (event) {
      var card = event.target.closest ? event.target.closest('.category-card') : null;
      if (!card) return;

      var category = card.getAttribute('data-category') || ALL;
      state.category = state.category === category ? ALL : category;
      setKeyword('');
      renderCategories();
      render();
      U.scrollToEl(recipeSection);
    });

    U.on(resetFiltersBtn, 'click', function () {
      resetFilters(true);
    });

    U.on(emptyResetBtn, 'click', function () {
      resetFilters(false);
    });

    // 搜索
    U.on(navInput, 'input', function () {
      setKeyword(navInput.value);
      applyKeyword();
    });
    U.on(navInput, 'keydown', function (event) {
      if (event.key === 'Enter') render();
    });
    U.$$('.search-box__clear').forEach(function (btn) {
      U.on(btn, 'click', function () {
        setKeyword('');
        render();
        var target = document.getElementById(btn.getAttribute('data-clear'));
        if (target) target.focus();
      });
    });

    // 恢复初始数据
    U.on(resetDataBtn, 'click', function () {
      var custom = S.customCount();
      if (custom === 0) {
        U.toast('当前没有需要清空的本地数据', 'success');
        return;
      }
      U.confirmDialog({
        title: '恢复初始数据？',
        text:
          '将删除你创建或编辑过的 ' +
          custom +
          ' 条菜谱记录，内置示例菜谱会恢复原样，该操作不可撤销。',
        okText: '确认恢复',
        danger: true
      }).then(function (ok) {
        if (!ok) return;
        try {
          S.clearCustom();
          refresh();
          U.toast('已恢复到初始数据', 'success');
        } catch (err) {
          U.toast((err && err.message) || '操作失败', 'error');
        }
      });
    });
  }

  /* ------------------------------------------------------------------------
     启动
     ------------------------------------------------------------------------ */
  function refresh() {
    loadData();
    hotRanked = rankByHeat(allRecipes);
    buildCarousel(hotRanked.slice(0, CAROUSEL_SIZE));
    renderCategories();
    render();
    renderFooter();
  }

  canAutoPlay = !prefersReducedMotion();

  U.bindNavScroll();
  updateToggle();
  bindCarousel();
  bindEvents();
  refresh();
  syncSearchBox();
})(window, document);

</script>
</body>
</html>

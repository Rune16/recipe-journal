<script>
// ===== js/storage.js =====
/* ==========================================================================
   食谱集 · js/storage.js
   存储层：内置数据 + 用户自建数据（localStorage）的合并、读写、删除与配额处理
   ========================================================================== */

(function (window) {
  'use strict';

  var App = window.App;

  var STORAGE_KEY = 'minicrm.recipes.custom.v1';

  /** 用户自建数据的缓存（失效后重新读取） */
  var cache = null;
  /** 读取失败时的提示信息，供页面消费一次 */
  var readErrorMessage = '';

  /* ------------------------------------------------------------------------
     校验与规范化：外部写入的数据可能被手工改坏，这里做一次兜底
     ------------------------------------------------------------------------ */
  function isValidRecipe(raw) {
    return (
      raw &&
      typeof raw === 'object' &&
      typeof raw.id === 'string' &&
      raw.id.length > 0 &&
      typeof raw.title === 'string'
    );
  }

  function toStringArray(value) {
    if (!Array.isArray(value)) return [];
    var result = [];
    value.forEach(function (item) {
      if (typeof item !== 'string') return;
      var text = item.trim();
      if (text === '' || result.indexOf(text) !== -1) return;
      result.push(text);
    });
    return result;
  }

  function normalizeIngredients(value) {
    if (!Array.isArray(value)) return [];
    return value
      .map(function (item) {
        return {
          name: String((item && item.name) || '').trim(),
          amount: String((item && item.amount) || '').trim()
        };
      })
      .filter(function (item) {
        return item.name !== '';
      });
  }

  function normalizeSteps(value) {
    if (!Array.isArray(value)) return [];
    return value
      .map(function (item) {
        if (typeof item === 'string') return { text: item.trim(), image: '' };
        return {
          text: String((item && item.text) || '').trim(),
          image: String((item && item.image) || '')
        };
      })
      .filter(function (item) {
        return item.text !== '';
      });
  }

  function normalize(raw) {
    var time = Number(raw.timeMinutes);
    var servings = Number(raw.servings);
    return {
      id: String(raw.id),
      title: String(raw.title || '').trim(),
      emoji: typeof raw.emoji === 'string' && raw.emoji ? raw.emoji : '🍽️',
      cover: typeof raw.cover === 'string' ? raw.cover : '',
      category: typeof raw.category === 'string' && raw.category ? raw.category : '家常菜',
      tags: toStringArray(raw.tags),
      difficulty:
        raw.difficulty === '简单' || raw.difficulty === '困难' ? raw.difficulty : '中等',
      timeMinutes: isFinite(time) && time > 0 ? Math.round(time) : 0,
      servings: isFinite(servings) && servings > 0 ? Math.round(servings) : 1,
      description: String(raw.description || '').trim(),
      ingredients: normalizeIngredients(raw.ingredients),
      steps: normalizeSteps(raw.steps),
      tips: String(raw.tips || '').trim(),
      createdAt: isFinite(Number(raw.createdAt)) && Number(raw.createdAt) > 0
        ? Number(raw.createdAt)
        : Date.now(),
      isCustom: raw.isCustom === true
    };
  }

  /* ------------------------------------------------------------------------
     底层读写
     ------------------------------------------------------------------------ */
  function getSeeds() {
    return Array.isArray(window.SEED_RECIPES) ? window.SEED_RECIPES : [];
  }

  function findSeed(id) {
    var seeds = getSeeds();
    for (var i = 0; i < seeds.length; i++) {
      if (seeds[i].id === id) return seeds[i];
    }
    return null;
  }

  function readCustom() {
    if (cache) return cache;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        cache = [];
        return cache;
      }
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('数据结构不是数组');
      cache = parsed.filter(isValidRecipe).map(normalize);
      return cache;
    } catch (err) {
      console.warn('[storage] 读取本地菜谱失败，已回退为仅内置数据：', err && err.message);
      readErrorMessage = '本地保存的数据无法解析，已临时回退为内置菜谱。';
      cache = [];
      return cache;
    }
  }

  /** 写入 localStorage，并把配额错误转换成可展示的提示 */
  function writeCustom(list) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      cache = list;
    } catch (err) {
      var isQuota =
        err &&
        (err.name === 'QuotaExceededError' ||
          err.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
          err.code === 22 ||
          err.code === 1014);
      console.warn('[storage] 写入本地菜谱失败：', err && err.name, err && err.message);
      if (isQuota) {
        throw new Error('本地存储空间已满，请删除部分自建菜谱或使用更小的图片。');
      }
      throw new Error('保存失败，浏览器本地存储不可用（是否处于隐私模式？）。');
    }
  }

  /* ------------------------------------------------------------------------
     对外接口
     ------------------------------------------------------------------------ */

  /**
   * 全部菜谱：内置 + 用户自建。
   * 同 id 时用户数据覆盖内置数据（用于「编辑内置菜谱生成覆盖记录」）。
   * 排序：创建时间由新到旧。
   */
  function getAll() {
    var map = {};
    var order = [];

    getSeeds().forEach(function (seed) {
      var recipe = normalize(seed);
      map[recipe.id] = recipe;
      order.push(recipe.id);
    });

    readCustom().forEach(function (recipe) {
      if (!Object.prototype.hasOwnProperty.call(map, recipe.id)) order.push(recipe.id);
      map[recipe.id] = recipe;
    });

    return order
      .map(function (id) {
        return map[id];
      })
      .sort(function (a, b) {
        return b.createdAt - a.createdAt;
      });
  }

  function getById(id) {
    if (!id) return null;
    var custom = readCustom();
    for (var i = 0; i < custom.length; i++) {
      if (custom[i].id === id) return custom[i];
    }
    var seed = findSeed(id);
    return seed ? normalize(seed) : null;
  }

  /** 该 id 是否被用户数据覆盖（内置菜谱被编辑过 / 用户自建） */
  function isOverridden(id) {
    if (!id) return false;
    return readCustom().some(function (item) {
      return item.id === id;
    });
  }

  /**
   * 新增或更新一条菜谱。
   * - 没有 id：创建用户自建菜谱
   * - id 命中用户数据：覆盖更新
   * - id 命中内置数据：写入一条覆盖记录（内置菜谱得以"被编辑"）
   * @returns {object} 落库后的完整菜谱对象
   */
  function save(input) {
    if (!input || typeof input !== 'object') {
      throw new Error('没有可保存的菜谱数据。');
    }
    if (!String(input.title || '').trim()) {
      throw new Error('菜谱名称不能为空。');
    }

    var list = readCustom().slice();
    var id = String(input.id || '').trim();
    var seed = id ? findSeed(id) : null;
    var isNew = id === '';

    var record = normalize(
      Object.assign({}, input, {
        id: id || App.Utils.uid('usr-'),
        isCustom: seed ? false : isNew ? true : input.isCustom === true,
        createdAt: seed
          ? normalize(seed).createdAt
          : isFinite(Number(input.createdAt)) && Number(input.createdAt) > 0
          ? Number(input.createdAt)
          : Date.now()
      })
    );

    var replaced = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === record.id) {
        list[i] = record;
        replaced = true;
        break;
      }
    }
    if (!replaced) list.push(record);

    writeCustom(list);
    return record;
  }

  /**
   * 删除菜谱。仅允许删除用户自建数据；内置菜谱未被编辑过时不可删除。
   * @returns {boolean} 是否删除成功
   */
  function remove(id) {
    var list = readCustom();
    var next = list.filter(function (item) {
      return item.id !== id;
    });
    if (next.length === list.length) return false;
    writeCustom(next);
    return true;
  }

  /** 清空全部用户数据，恢复到初始的内置示例状态 */
  function clearCustom() {
    try {
      window.localStorage.removeItem(STORAGE_KEY);
    } catch (err) {
      console.warn('[storage] 清空本地数据失败：', err && err.message);
      throw new Error('清空失败，浏览器本地存储不可用。');
    }
    cache = [];
  }

  function customCount() {
    return readCustom().length;
  }

  function seedCount() {
    return getSeeds().length;
  }

  /** 当前占用的存储字节数（近似值，用于容量提示） */
  function getUsageBytes() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? raw.length : 0;
    } catch (err) {
      return 0;
    }
  }

  /** 取走一次读取错误提示（取走后清空，避免重复弹出） */
  function consumeReadError() {
    var message = readErrorMessage;
    readErrorMessage = '';
    return message;
  }

  App.Storage = {
    STORAGE_KEY: STORAGE_KEY,
    getAll: getAll,
    getById: getById,
    save: save,
    remove: remove,
    clearCustom: clearCustom,
    isOverridden: isOverridden,
    customCount: customCount,
    seedCount: seedCount,
    getUsageBytes: getUsageBytes,
    consumeReadError: consumeReadError
  };
})(window);

</script>
<script>
// ===== js/image.js =====
/* ==========================================================================
   食谱集 · js/image.js
   图片处理：文件校验 → canvas 等比压缩 → base64 DataURL → 上传区预览绑定
   压缩必须在写入 localStorage 之前完成，用于规避约 5MB 的容量上限。
   ========================================================================== */

(function (window, document) {
  'use strict';

  var App = window.App;
  var U = App.Utils;

  var MAX_FILE_BYTES = 8 * 1024 * 1024; // 单张图片输入上限 8MB
  var MAX_EDGE = 1200; // 压缩后最长边
  var JPEG_QUALITY = 0.78;

  /* ------------------------------------------------------------------------
     校验
     ------------------------------------------------------------------------ */
  function validate(file) {
    if (!file) return '没有选择文件。';
    if (!/^image\//i.test(file.type || '')) {
      return '请选择图片文件（JPG / PNG / WebP）。';
    }
    if (file.size > MAX_FILE_BYTES) {
      return '图片体积需小于 8MB，当前约 ' + (file.size / 1048576).toFixed(1) + 'MB。';
    }
    return '';
  }

  /* ------------------------------------------------------------------------
     读取与压缩
     ------------------------------------------------------------------------ */
  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        resolve(String(reader.result || ''));
      };
      reader.onerror = function () {
        reject(new Error('图片读取失败，请重试或换一张图片。'));
      };
      reader.readAsDataURL(file);
    });
  }

  function loadImage(dataUrl) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        resolve(img);
      };
      img.onerror = function () {
        reject(new Error('图片无法解码，请换一张图片。'));
      };
      img.src = dataUrl;
    });
  }

  /**
   * 等比压缩图片，返回 base64 DataURL。
   * 若压缩结果反而更大（例如很小的 PNG），则保留原始 DataURL。
   */
  function compress(file) {
    return readAsDataUrl(file)
      .then(function (original) {
        return loadImage(original).then(function (img) {
          var width = img.naturalWidth || img.width;
          var height = img.naturalHeight || img.height;
          if (!width || !height) throw new Error('图片尺寸异常，无法处理。');

          var scale = Math.min(1, MAX_EDGE / Math.max(width, height));
          var targetW = Math.max(1, Math.round(width * scale));
          var targetH = Math.max(1, Math.round(height * scale));

          var canvas = document.createElement('canvas');
          canvas.width = targetW;
          canvas.height = targetH;

          var ctx = canvas.getContext('2d');
          if (!ctx) throw new Error('当前浏览器不支持图片压缩。');

          // 铺白底，避免带透明通道的 PNG 转 JPEG 后发黑
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, targetW, targetH);
          ctx.drawImage(img, 0, 0, targetW, targetH);

          var compressed;
          try {
            compressed = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
          } catch (err) {
            console.warn('[image] canvas 导出失败：', err && err.message);
            throw new Error('图片压缩失败，请换一张图片试试。');
          }

          if (!compressed || compressed === 'data:,') {
            throw new Error('图片压缩失败，请换一张图片试试。');
          }

          return compressed.length < original.length ? compressed : original;
        });
      })
      .catch(function (err) {
        console.warn('[image] 处理失败：', err && err.message);
        throw err instanceof Error ? err : new Error('图片处理失败，请重试。');
      });
  }

  /* ------------------------------------------------------------------------
     上传区绑定
     ------------------------------------------------------------------------ */

  /**
   * 把一个 .uploader 元素变成可用的图片上传控件。
   * 需要的最小 HTML 结构：
   *   <div class="uploader">
   *     <input type="file" accept="image/*" class="sr-only">
   *     <div class="uploader__placeholder">…</div>
   *     <img class="uploader__preview hidden" alt="">
   *     <button type="button" class="uploader__remove">×</button>
   *   </div>
   *
   * @param {HTMLElement} root .uploader 元素
   * @param {object} [options] { onChange(value), onError(message), toast: boolean }
   */
  function bindUploader(root, options) {
    var opts = options || {};
    var input = root.querySelector('input[type="file"]');
    var preview = root.querySelector('.uploader__preview');
    var removeBtn = root.querySelector('.uploader__remove');
    var value = '';

    function notify() {
      if (typeof opts.onChange === 'function') opts.onChange(value);
    }

    function setValue(dataUrl, silent) {
      value = dataUrl || '';
      root.classList.remove('is-loading');

      if (value) {
        root.classList.add('has-image');
        if (preview) {
          preview.src = value;
          preview.classList.remove('hidden');
        }
      } else {
        root.classList.remove('has-image');
        if (preview) {
          preview.removeAttribute('src');
          preview.classList.add('hidden');
        }
      }

      if (!silent) notify();
    }

    function fail(message) {
      root.classList.remove('is-loading');
      if (typeof opts.onError === 'function') opts.onError(message);
      else U.toast(message, 'error');
    }

    function handleFile(file) {
      var problem = validate(file);
      if (problem) {
        fail(problem);
        return;
      }
      root.classList.add('is-loading');
      compress(file)
        .then(function (dataUrl) {
          setValue(dataUrl, true);
          notify();
          if (opts.toast !== false) U.toast('图片已就绪', 'success', 1600);
        })
        .catch(function (err) {
          fail((err && err.message) || '图片处理失败，请重试。');
        });
    }

    U.on(root, 'click', function (event) {
      var target = event.target;
      if (target && target.closest && target.closest('.uploader__remove')) return;
      if (input) input.click();
    });

    U.on(input, 'change', function () {
      var file = input.files && input.files[0];
      if (file) handleFile(file);
      // 允许连续选择同一个文件
      input.value = '';
    });

    U.on(removeBtn, 'click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      setValue('');
      U.toast('已移除图片', 'success', 1400);
    });

    ['dragenter', 'dragover'].forEach(function (type) {
      U.on(root, type, function (event) {
        event.preventDefault();
        root.classList.add('is-dragover');
      });
    });

    ['dragleave', 'dragend'].forEach(function (type) {
      U.on(root, type, function () {
        root.classList.remove('is-dragover');
      });
    });

    U.on(root, 'drop', function (event) {
      event.preventDefault();
      root.classList.remove('is-dragover');
      var dt = event.dataTransfer;
      var file = dt && dt.files && dt.files[0];
      if (file) handleFile(file);
    });

    return {
      setValue: setValue,
      getValue: function () {
        return value;
      },
      clear: function () {
        setValue('');
      }
    };
  }

  App.Image = {
    MAX_FILE_BYTES: MAX_FILE_BYTES,
    MAX_EDGE: MAX_EDGE,
    validate: validate,
    compress: compress,
    bindUploader: bindUploader
  };
})(window, document);

</script>
<script>
// ===== js/edit.js =====
/* ==========================================================================
   食谱集 · js/edit.js
   表单页逻辑：新增 / 编辑菜谱
   - 动态用料行、动态步骤行（可增删、可上下移动）
   - 封面图与步骤图上传（canvas 压缩 → base64 → 预览）

(function (window, document) {

  var App = window.App;
  var U = App.Utils;

  var Img = App.Image;

  var form = U.$('#recipeForm');
  if (!form) return;

     常量
     ------------------------------------------------------------------------ */
  var CATEGORY_EMOJI = {
    川菜: '🌶️',
    粤菜: '🐟',
    家常菜: '🍲',
    汤羹: '🍜',
    甜品: '🍮',
    素食: '🥬'
  };

  var EMOJI_OPTIONS = [
    '🍲', '🥘', '🍜', '🍚', '🐟', '🦐', '🍗', '🥩',
    '🥦', '🍅', '🍮', '🥭', '🍰', '🍳', '🌶️', '🥬'
  ];

  var DEFAULT_TIME = 30;
  var DEFAULT_SERVINGS = 2;

  /* ------------------------------------------------------------------------
     元素引用
     ------------------------------------------------------------------------ */
  var titleInput = U.$('#titleInput');
  var categorySelect = U.$('#categorySelect');
  var difficultySelect = U.$('#difficultySelect');
  var timeInput = U.$('#timeInput');
  var servingsInput = U.$('#servingsInput');

  var coverUploader = U.$('#coverUploader');
  var emojiPicker = U.$('#emojiPicker');
  var errorSummary = U.$('#errorSummary');
  var errorSummaryText = U.$('#errorSummaryText');
  var storageText = U.$('#storageText');
  var pageTitle = U.$('#pageTitle');
  var backBtn = U.$('#backBtn');
  var cancelBtn = U.$('#cancelBtn');

  /* ------------------------------------------------------------------------
     模式判定
     ------------------------------------------------------------------------ */
  var editingId = U.getQueryParam('id', '') || '';
  var existing = editingId ? S.getById(editingId) : null;
  var isEditing = !!existing;
  var selectedEmoji = '🍲';

  if (editingId && !existing) {
    U.toast('没有找到要编辑的菜谱，已返回列表。', 'error', 2600);
    window.setTimeout(function () {
      window.location.href = 'index.html';
    }, 900);
    return;
  }

  /* ------------------------------------------------------------------------
     下拉选项
     ------------------------------------------------------------------------ */
  function categoryOptions() {
    var order = (window.SEED_CATEGORIES || []).slice();
    S.getAll().forEach(function (recipe) {
      if (recipe.category && order.indexOf(recipe.category) === -1) order.push(recipe.category);
    });
    return order;
  }

  function renderSelects() {
    categorySelect.innerHTML = categoryOptions()
      .map(function (category) {
        return '<option value="' + U.escapeHtml(category) + '">' + U.escapeHtml(category) + '</option>';
      })
      .join('');

    difficultySelect.innerHTML = (window.DIFFICULTIES || ['简单', '中等', '困难'])
      .map(function (level) {
        return '<option value="' + U.escapeHtml(level) + '">' + U.escapeHtml(level) + '</option>';
      })
      .join('');
  }

  /* ------------------------------------------------------------------------
     图标封面
     ------------------------------------------------------------------------ */
  function renderEmojiPicker() {
    emojiPicker.innerHTML = EMOJI_OPTIONS.map(function (emoji) {
      return (
        '<button type="button" class="emoji-option" data-emoji="' +
        emoji +
        '" aria-label="使用 ' +
        emoji +
        ' 作为封面图标">' +
        emoji +
        '</button>'
      );
    }).join('');
  }

  function selectEmoji(emoji) {
    selectedEmoji = emoji || '🍲';
    U.$$('.emoji-option', emojiPicker).forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-emoji') === selectedEmoji);
    });
  }

  /* ------------------------------------------------------------------------
     动态行：用料
     ------------------------------------------------------------------------ */
  function createIngredientRow(name, amount) {
    var row = document.createElement('div');
    row.className = 'ingredient-row';
    row.innerHTML =
      '<input class="input" type="text" data-role="name" maxlength="24" autocomplete="off" placeholder="食材名称，如 嫩豆腐" aria-label="食材名称" />' +
      '<input class="input" type="text" data-role="amount" maxlength="24" autocomplete="off" placeholder="用量，如 400 克" aria-label="用量" />' +
      '<button class="row-remove" type="button" aria-label="删除这行用料">' +
      U.icon('trash') +
      '</button>';

    row.querySelector('[data-role="name"]').value = name || '';
    row.querySelector('[data-role="amount"]').value = amount || '';
    return row;
  }

  function addIngredientRow(name, amount) {
    var row = createIngredientRow(name, amount);
    ingredientList.appendChild(row);
    return row;
  }

  /* ------------------------------------------------------------------------
     动态行：步骤
     ------------------------------------------------------------------------ */
  function createStepRow(step) {
    var row = document.createElement('div');
    row.className = 'step-row';
    row.innerHTML =
      '<span class="step-row__index">1</span>' +
      '<div class="step-row__body">' +
      '<div class="step-row__head">' +
      '<span class="step-row__label">第 1 步</span>' +
      '<div class="step-row__tools">' +
      '<button class="row-remove" type="button" data-move="up" aria-label="上移这一步">' +
      U.icon('arrowUp') +
      '</button>' +
      '<button class="row-remove" type="button" data-move="down" aria-label="下移这一步">' +
      U.icon('arrowDown') +
      '</button>' +
      '<button class="row-remove" type="button" data-remove-step aria-label="删除这一步">' +
      U.icon('trash') +
      '</button>' +
      '</div></div>' +
      '<textarea class="textarea" rows="3" maxlength="300" data-role="text" placeholder="描述这一步要做什么"></textarea>' +
      '<div class="uploader uploader--mini">' +
      '<input type="file" accept="image/*" class="sr-only" aria-label="选择步骤配图" />' +
      '<div class="uploader__placeholder">' +
      U.icon('camera') +
      '<span class="uploader__title">上传步骤图</span>' +
      '</div>' +
      '<img class="uploader__preview hidden" alt="步骤配图预览" />' +
      '<button class="uploader__remove" type="button" aria-label="移除步骤配图">' +
      U.icon('close') +
      '</button>' +
      '</div></div>';

    row.querySelector('[data-role="text"]').value = (step && step.text) || '';

    var uploader = row.querySelector('.uploader');
    row._uploader = Img.bindUploader(uploader, { toast: false });
    if (step && step.image) row._uploader.setValue(step.image, true);

    return row;
  }

  function addStepRow(step) {
    var row = createStepRow(step);
    stepList.appendChild(row);
    refreshStepIndexes();
    return row;
  }

  function refreshStepIndexes() {
    U.$$('.step-row', stepList).forEach(function (row, index) {
      var num = index + 1;
      var badge = U.$('.step-row__index', row);
      var label = U.$('.step-row__label', row);
      if (badge) badge.textContent = String(num);
      if (label) label.textContent = '第 ' + num + ' 步';
      var textarea = U.$('[data-role="text"]', row);
      if (textarea) textarea.setAttribute('placeholder', '描述第 ' + num + ' 步要做什么');
    });
  }

  function moveStep(row, direction) {
    if (direction === 'up') {
      var prev = row.previousElementSibling;
      if (prev) stepList.insertBefore(row, prev);
    } else {
      var next = row.nextElementSibling;
      if (next) stepList.insertBefore(next, row);
    }
    refreshStepIndexes();
  }

  /* ------------------------------------------------------------------------
     表单校验
     ------------------------------------------------------------------------ */
  function parseNumberInput(input, min, max, fallback) {
    var raw = (input.value || '').trim();
    if (raw === '') return { value: fallback, valid: true };
    var num = Number(raw);
    if (!isFinite(num) || num < min || num > max) return { value: fallback, valid: false };
    return { value: Math.round(num), valid: true };
  }

  function parseTags(raw) {
    return String(raw || '')
      .split(/[,，、;；\s]+/)
      .map(function (tag) {
        return tag.trim().replace(/^#/, '');
      })
      .filter(function (tag, index, list) {
        return tag !== '' && list.indexOf(tag) === index;
      })
      .slice(0, 8);
  }

  function collect() {
    var time = parseNumberInput(timeInput, 1, 600, DEFAULT_TIME);
    var servings = parseNumberInput(servingsInput, 1, 20, DEFAULT_SERVINGS);

    var ingredients = U.$$('.ingredient-row', ingredientList)
      .map(function (row) {
        return {
          name: (U.$('[data-role="name"]', row).value || '').trim(),
          amount: (U.$('[data-role="amount"]', row).value || '').trim()
        };
      })
      .filter(function (item) {
        return item.name !== '';
      });

    var steps = U.$$('.step-row', stepList)
      .map(function (row) {
        return {
          text: (U.$('[data-role="text"]', row).value || '').trim(),
          image: row._uploader ? row._uploader.getValue() : ''
        };
      })
      .filter(function (step) {
        return step.text !== '';
      });

    return {
      title: (titleInput.value || '').trim(),
      category: categorySelect.value,
      difficulty: difficultySelect.value,
      timeMinutes: time.valid ? time.value : null,
      servings: servings.valid ? servings.value : null,
      description: (descInput.value || '').trim(),
      tags: parseTags(tagsInput.value),
      tips: (tipsInput.value || '').trim(),
      emoji: selectedEmoji,
      cover: coverUploaderController ? coverUploaderController.getValue() : '',
      ingredients: ingredients,
      steps: steps
    };
  }

  function validate(data) {
    var errors = [];
    if (!data.title) errors.push({ field: 'title', message: '请填写菜谱名称。' });
    if (!data.category) errors.push({ field: 'category', message: '请选择分类。' });
    if (data.timeMinutes === null) {
      errors.push({ field: 'timeMinutes', message: '烹饪时长需为 1 ~ 600 之间的数字。' });
    }
    if (data.servings === null) {
      errors.push({ field: 'servings', message: '份量需为 1 ~ 20 之间的数字。' });
    }
    if (!data.ingredients.length) {
      errors.push({ field: 'ingredients', message: '至少填写一条用料，食材名称不能为空。' });
    }
    if (!data.steps.length) {
      errors.push({ field: 'steps', message: '至少填写一个做菜步骤，步骤内容不能为空。' });
    }
    return errors;
  }

  function fieldBox(name) {
    return form.querySelector('.field[data-field="' + name + '"]');
  }

  function clearErrors() {
    U.$$('.field.has-error', form).forEach(function (box) {
      box.classList.remove('has-error');
    });
    var slots = U.$$('.field__error', form);
    slots.forEach(function (slot) {
      slot.textContent = '';
    });
    errorSummary.classList.remove('is-visible');
    errorSummaryText.textContent = '';
  }

  function showErrors(errors) {
    var firstBox = null;

    errors.forEach(function (error) {
      var box = fieldBox(error.field);
      if (box) {
        box.classList.add('has-error');
        var slot = U.$('.field__error', box);
        if (slot && !slot.textContent) slot.textContent = error.message;
        if (!firstBox) firstBox = box;
      }
    });

    errorSummaryText.textContent =
      '还有 ' + errors.length + ' 处需要完善：' + errors.map(function (e) { return e.message; }).join(' ');
    errorSummary.classList.add('is-visible');

    if (firstBox) {
      U.scrollToEl(firstBox);
      var focusable = firstBox.querySelector('input, textarea, select, button');
      if (focusable) window.setTimeout(function () { focusable.focus(); }, 260);
    }
  }

  /* ------------------------------------------------------------------------
     存储用量提示
     ------------------------------------------------------------------------ */
  function updateStorageText() {
    var bytes = S.getUsageBytes();
    var kb = bytes / 1024;
    storageText.textContent =
      '已保存 ' + S.customCount() + ' 条本地数据，占用约 ' +
      kb.toFixed(1) + ' KB。浏览器一般限制在 5MB 左右，放太多大图时请注意。';
  }

  /* ------------------------------------------------------------------------
     保存
     ------------------------------------------------------------------------ */
  function handleSubmit(event) {
    event.preventDefault();
    clearErrors();

    var data = collect();
    var errors = validate(data);
    if (errors.length) {
      showErrors(errors);
      U.toast('表单还没填完，请检查标红的项目', 'error', 2600);
      return;
    }

    var payload = Object.assign({}, existing || {}, data);
    if (!isEditing) payload.id = '';

    try {
      var saved = S.save(payload);
      updateStorageText();
      U.toast('保存成功，正在打开详情页…', 'success', 1600);
      window.setTimeout(function () {
        window.location.href = 'detail.html?id=' + encodeURIComponent(saved.id);
      }, 650);
    } catch (err) {
      U.toast((err && err.message) || '保存失败，请重试。', 'error', 4600);
    }
  }

  /* ------------------------------------------------------------------------
     事件绑定
     ------------------------------------------------------------------------ */
  var coverUploaderController = null;

  function bindEvents() {
    U.on(addIngredientBtn, 'click', function () {
      var row = addIngredientRow('', '');
      var input = U.$('[data-role="name"]', row);
      if (input) input.focus();
    });

    U.on(addStepBtn, 'click', function () {
      addStepRow({ text: '', image: '' });
      var rows = U.$$('.step-row', stepList);
      var last = rows[rows.length - 1];
      if (last) {
        var textarea = U.$('[data-role="text"]', last);
        if (textarea) textarea.focus();
        U.scrollToEl(last);
      }
    });

    U.on(ingredientList, 'click', function (event) {
      var btn = event.target.closest ? event.target.closest('.row-remove') : null;
      if (!btn) return;
      var row = btn.closest('.ingredient-row');
      if (row) row.parentNode.removeChild(row);
    });

    U.on(stepList, 'click', function (event) {
      var moveBtn = event.target.closest ? event.target.closest('[data-move]') : null;
      if (moveBtn) {
        var target = moveBtn.closest('.step-row');
        if (target) moveStep(target, moveBtn.getAttribute('data-move'));
        return;
      }
      var removeBtn = event.target.closest ? event.target.closest('[data-remove-step]') : null;
      if (removeBtn) {
        var row = removeBtn.closest('.step-row');
        if (row) {
          row.parentNode.removeChild(row);
          refreshStepIndexes();
        }
      }
    });

    U.on(stepList, 'input', function (event) {
      var target = event.target;
      if (target && target.getAttribute && target.getAttribute('data-role') === 'text') {
        var box = target.closest('.field');
        if (box) box.classList.remove('has-error');
      }
    });

    U.on(emojiPicker, 'click', function (event) {
      var btn = event.target.closest ? event.target.closest('.emoji-option') : null;
      if (!btn) return;
      selectEmoji(btn.getAttribute('data-emoji'));
    });

    U.on(categorySelect, 'change', function () {
      // 新建时跟随分类给一个合适的默认图标
      if (!isEditing && EMOJI_OPTIONS.indexOf(selectedEmoji) !== -1) {
        selectEmoji(CATEGORY_EMOJI[categorySelect.value] || selectedEmoji);
      }
    });

    U.on(form, 'submit', handleSubmit);
  }

  /* ------------------------------------------------------------------------
     初始化
     ------------------------------------------------------------------------ */
  function fillExisting() {
    titleInput.value = existing.title;
    categorySelect.value = existing.category;
    if (categorySelect.value !== existing.category) {
      categorySelect.appendChild(
        new Option(existing.category, existing.category, true, true)
      );
    }
    difficultySelect.value = existing.difficulty;
    timeInput.value = existing.timeMinutes > 0 ? String(existing.timeMinutes) : '';
    servingsInput.value = existing.servings > 0 ? String(existing.servings) : '';
    descInput.value = existing.description;
    tagsInput.value = existing.tags.join(', ');
    tipsInput.value = existing.tips;

    selectEmoji(existing.emoji);

    if (existing.cover && coverUploaderController) {
      coverUploaderController.setValue(existing.cover, true);
    }

    if (existing.ingredients.length) {
      existing.ingredients.forEach(function (item) {
        addIngredientRow(item.name, item.amount);
      });
    } else {
      addIngredientRow('', '');
    }

    if (existing.steps.length) {
      existing.steps.forEach(function (step) {
        addStepRow(step);
      });
    } else {
      addStepRow({ text: '', image: '' });
    }
    refreshStepIndexes();
  }

  function fillBlank() {
    var categories = categoryOptions();
    if (categories.length) categorySelect.value = categories[0];
    difficultySelect.value = '简单';
    timeInput.value = '';
    servingsInput.value = '';
    selectEmoji(CATEGORY_EMOJI[categorySelect.value] || '🍲');

    addIngredientRow('', '');
    addIngredientRow('', '');
    addIngredientRow('', '');
    addStepRow({ text: '', image: '' });
    addStepRow({ text: '', image: '' });
    refreshStepIndexes();
  }

  function applyModeChrome() {
    if (isEditing) {
      pageTitle.textContent = '编辑菜谱';
      document.title = '编辑「' + existing.title + '」· 食谱集';
      var detailUrl = 'detail.html?id=' + encodeURIComponent(existing.id);
      if (backBtn) backBtn.setAttribute('href', detailUrl);
      if (cancelBtn) cancelBtn.setAttribute('href', detailUrl);
    } else {
      pageTitle.textContent = '新建菜谱';
      document.title = '新建菜谱 · 食谱集';
    }
  }

  /* ------------------------------------------------------------------------
     启动
     ------------------------------------------------------------------------ */
  renderSelects();
  renderEmojiPicker();
  coverUploaderController = Img.bindUploader(coverUploader, {
    onChange: function () {
      updateStorageText();
    }
  });
  bindEvents();
  applyModeChrome();

  if (isEditing) fillExisting();
  else fillBlank();

  updateStorageText();
  U.bindNavScroll();

  var readError = S.consumeReadError();
  if (readError) U.toast(readError, 'error', 4200);
})(window, document);

</script>
</body>
</html>
